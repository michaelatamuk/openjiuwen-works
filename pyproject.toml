[project]
name = "openjiuwen-works"
version = "0.0.1"
description = "A software factory: one signal in, a released fix out."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["agents", "software-factory", "verification", "evidence"]
dependencies = [
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "filelock>=3.13",
  "opentelemetry-api>=1.27",
]

[project.urls]
Repository = "https://github.com/michaelatamuk/openjiuwen-works"
Issues = "https://github.com/michaelatamuk/openjiuwen-works/issues"


[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "mutmut>=2.4",
  "pre-commit>=3.7",
  "httpx>=0.27",
]
live = [
  "claude-agent-sdk>=0.2.121,<0.3",
]
# Jiuwen native: openjiuwen ships the DeepAgent runtime and pins most of its own tree
# (anthropic, openai, sqlalchemy, transformers, pymilvus, trafilatura, ...). The probe also
# needs the three modules openjiuwen keeps outside its core set.
native = [
  "openjiuwen>=0.1.21,<0.2",
  "httpx>=0.24",
  "jsonschema-path",
  "tqdm",
]
# DeepSeek Harness SDK (still a 0.2 release candidate upstream; pinned tightly on purpose).
dsh = [
  "deepseek-harness-sdk>=0.2.2rc2,<0.3",
]
codex = [
  "openai-codex>=0.172",
]
# One extra for "every live provider": what the Settings surface and `works doctor` recommend.
providers = [
  "openjiuwen>=0.1.21,<0.2",
  "httpx>=0.24",
  "jsonschema-path",
  "tqdm",
  "deepseek-harness-sdk>=0.2.2rc2,<0.3",
  "openai-codex>=0.172",
  "claude-agent-sdk>=0.2.121,<0.3",
]
preview = [
  "playwright>=1.49",
]
server = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sse-starlette>=2.1",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.scripts]
works = "works.interfaces.cli.main:main_entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/works"]

[tool.hatch.build.targets.wheel.force-include]
"flows" = "works/resources/flows"
"scripts/agent_chat_worker.py" = "works/resources/scripts/agent_chat_worker.py"
"scripts/team_verify_worker.py" = "works/resources/scripts/team_verify_worker.py"
"scripts/swarm_adapter.py" = "works/resources/scripts/swarm_adapter.py"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["archive", "scripts", "fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4", "DTZ", "T20", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S310", "S603", "S607"]
"src/works/adapters/processes/runner.py" = ["S603", "S607"]
"src/works/adapters/git/repo.py" = ["S603", "S607"]
"src/works/application/execution/readiness/**" = ["S404", "S603"]
"src/works/interfaces/cli/**" = ["T201"]
"src/works/application/assistant/chat.py" = ["S603", "S607"]
"src/works/application/team/launcher.py" = ["S603", "S607"]
"scripts/**" = ["T20", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["openjiuwen.*"]
ignore_missing_imports = true
# openjiuwen is a host-provided package without a py.typed marker; the live adapter is the only
# place that touches it and its types are isolated behind Any at that boundary.

[[tool.mypy.overrides]]
module = ["laix.*"]
ignore_missing_imports = true
# laix is an optional local checkout; CI does not install it, and the adapter is the only consumer.

[[tool.mypy.overrides]]
module = ["opentelemetry.exporter.*"]
ignore_missing_imports = true
# The OTLP exporter is in the server extra; the console exporter needs only the SDK.

[[tool.mypy.overrides]]
module = ["playwright.*"]
ignore_missing_imports = true
# Playwright is the optional `preview` extra; the import is lazy and fails closed.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not slow'"
markers = [
  "integration: runs the whole loop against a fixture repository",
  "slow: takes over two seconds",
]

[tool.coverage.run]
source = ["src/works"]
branch = true
# This bridge imports the host agent-core runtime and is exercised in agent-core's own Python.
omit = ["src/works/application/team/verify.py"]

[tool.coverage.report]
skip_covered = true
show_missing = true
fail_under = 80

[tool.mutmut]
source_paths = ["src/works"]
only_mutate = [
  "src/works/domain/state.py",
  "src/works/domain/policy.py",
  "src/works/adapters/queue/store.py",
  "src/works/adapters/queue/index.py",
  "src/works/interfaces/api/jobs.py",
]
pytest_add_cli_args_test_selection = ["tests", "--ignore=tests/integration"]
also_copy = ["flows", "fixtures"]


[tool.bandit]
exclude_dirs = ["tests", ".venv"]
