[project]
name = "openjiuwen-works"
version = "0.0.1"
description = "A software factory: one signal in, a released fix out."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["agents", "software-factory", "verification", "evidence"]
dependencies = [
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "filelock>=3.13",
]

[project.urls]
Repository = "https://github.com/michaelatamuk/openjiuwen-works"
Issues = "https://github.com/michaelatamuk/openjiuwen-works/issues"


[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "mutmut>=2.4",
  "pre-commit>=3.7",
]

[project.scripts]
works = "works.cli:main_entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/works"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["archive", "scripts", "fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4", "DTZ", "T20", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]
"src/works/runner.py" = ["S603", "S607"]
"src/works/gitops.py" = ["S603", "S607"]
"src/works/cli.py" = ["T201"]
"scripts/**" = ["T20", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not slow'"
markers = [
  "integration: runs the whole loop against a fixture repository",
  "slow: takes over two seconds",
]

[tool.coverage.run]
source = ["src/works"]
branch = true

[tool.coverage.report]
skip_covered = true
show_missing = true
fail_under = 80

[tool.mutmut]
source_paths = [
  "src/works/state.py",
  "src/works/policy.py",
  "src/works/queue.py",
]
pytest_add_cli_args_test_selection = ["tests"]
debug = true


[tool.bandit]
exclude_dirs = ["tests", ".venv"]
