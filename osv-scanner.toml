# OSV.dev ignores. Every entry names the upstream pin that blocks the fix and an expiry date,
# so the ignore is re-checked instead of becoming permanent.

[[IgnoredVulns]]
id = "GHSA-567q-5qvw-pf92"
ignoreUntil = 2027-03-01
reason = "filelock is pinned below 4.0 by openjiuwen 0.1.21 (the only released version); 4.2.1 cannot be installed until that pin is relaxed. Filelock only guards the local agent runtime's cache and temp files."

