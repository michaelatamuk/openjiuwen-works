<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Inter, Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <filter id="soft2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#111827" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="#F4F5F9"/>

  <!-- Header -->
  <text x="80" y="66" font-size="12" font-weight="700" fill="#6D28D9" letter-spacing="2.2">OPENJIUWEN WORKS · BACKGROUND</text>
  <text x="80" y="116" font-size="42" font-weight="700" fill="#111827">Why now — and what it takes to run one</text>
  <text x="80" y="150" font-size="17" fill="#4B5563">Four things behind the one-pager: what changed, what holds the factory up, which flows it runs, and how we measure success.</text>

  <!-- 1. WHY NOW -->
  <rect x="80" y="195" width="710" height="250" rx="18" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#soft2)"/>
  <text x="104" y="229" font-size="11" font-weight="700" fill="#6D28D9" letter-spacing="1.6">1 · WHY NOW</text>
  <text x="104" y="272" font-size="15" fill="#374151"><tspan font-weight="700" fill="#111827">Today</tspan> — people answer the agent all day, on their own laptop.</text>
  <text x="104" y="308" font-size="15" fill="#374151"><tspan font-weight="700" fill="#111827">Next</tspan> — the agent works; LAIX decides when people are needed.</text>
  <text x="104" y="344" font-size="15" fill="#374151"><tspan font-weight="700" fill="#111827">Elsewhere</tspan> — a signal at 3am is a mergeable fix by morning.</text>
  <text x="104" y="392" font-size="14" fill="#6B7280">Security work sets the pace: findings arrive faster than people can read them.</text>

  <!-- 2. WHAT RUNS IT -->
  <rect x="810" y="195" width="710" height="250" rx="18" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#soft2)"/>
  <text x="834" y="229" font-size="11" font-weight="700" fill="#6D28D9" letter-spacing="1.6">2 · WHAT RUNS IT</text>

  <circle cx="840" cy="268" r="4" fill="#6D28D9"/>
  <text x="858" y="273" font-size="15" fill="#374151">A sandbox per task — one change never touches another.</text>
  <circle cx="840" cy="304" r="4" fill="#6D28D9"/>
  <text x="858" y="309" font-size="15" fill="#374151">Retry and resume — a crash does not lose the run.</text>
  <circle cx="840" cy="340" r="4" fill="#6D28D9"/>
  <text x="858" y="345" font-size="15" fill="#374151">Policy outside the agent — it cannot exceed its rights.</text>
  <circle cx="840" cy="376" r="4" fill="#6D28D9"/>
  <text x="858" y="381" font-size="15" fill="#374151">LAIX decides the gate — act, ask, wait or verify, with a reason.</text>
  <circle cx="840" cy="412" r="4" fill="#6D28D9"/>
  <text x="858" y="417" font-size="15" fill="#374151">Every decision is recorded; a budget per task caps cost.</text>

  <!-- 3. MANY FLOWS -->
  <rect x="80" y="470" width="710" height="250" rx="18" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#soft2)"/>
  <text x="104" y="504" font-size="11" font-weight="700" fill="#6D28D9" letter-spacing="1.6">3 · MANY FLOWS, DIFFERENT LIGHT</text>

  <circle cx="110" cy="543" r="5" fill="#10B981"/>
  <text x="128" y="548" font-size="15" fill="#374151"><tspan font-weight="700" fill="#111827">Documentation</tspan> — fully automatic, no gate.</text>
  <circle cx="110" cy="579" r="5" fill="#10B981"/>
  <text x="128" y="584" font-size="15" fill="#374151"><tspan font-weight="700" fill="#111827">Dependency updates</tspan> — merge when CI is green.</text>
  <circle cx="110" cy="615" r="5" fill="#F59E0B"/>
  <text x="128" y="620" font-size="15" fill="#374151"><tspan font-weight="700" fill="#111827">Bugfix</tspan> — a person reviews the change.</text>
  <circle cx="110" cy="651" r="5" fill="#EF4444"/>
  <text x="128" y="656" font-size="15" fill="#374151"><tspan font-weight="700" fill="#111827">Payments</tspan> — a person approves every step.</text>

  <text x="104" y="697" font-size="13" fill="#6B7280">Autonomy follows risk and test coverage, not ambition.</text>

  <!-- 4. HOW WE MEASURE SUCCESS -->
  <rect x="810" y="470" width="710" height="250" rx="18" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#soft2)"/>
  <text x="834" y="504" font-size="11" font-weight="700" fill="#6D28D9" letter-spacing="1.6">4 · HOW WE MEASURE SUCCESS</text>

  <circle cx="840" cy="543" r="4" fill="#6D28D9"/>
  <text x="858" y="548" font-size="15" fill="#374151">Time from signal to released fix.</text>
  <circle cx="840" cy="577" r="4" fill="#6D28D9"/>
  <text x="858" y="582" font-size="15" fill="#374151">Share of changes that ship with a proof page.</text>
  <circle cx="840" cy="611" r="4" fill="#6D28D9"/>
  <text x="858" y="616" font-size="15" fill="#374151">Human minutes per change.</text>
  <circle cx="840" cy="645" r="4" fill="#6D28D9"/>
  <text x="858" y="650" font-size="15" fill="#374151">Escaped defects per hundred changes.</text>
  <circle cx="840" cy="679" r="4" fill="#6D28D9"/>
  <text x="858" y="684" font-size="15" fill="#374151">Cost per released fix.</text>

  <!-- Footer -->
  <line x1="80" y1="762" x2="1520" y2="762" stroke="#DDE2E8" stroke-width="1.5"/>
  <text x="80" y="796" font-size="14" fill="#374151">Built in your own cloud: your code, your data, no lock-in.</text>
  <text x="1520" y="796" font-size="12.5" fill="#9CA3AF" text-anchor="end">Benchmark from a public AWS demo, Nov 2026: one issue → one PR in ~3 min, ~$0.33.</text>
</svg>
