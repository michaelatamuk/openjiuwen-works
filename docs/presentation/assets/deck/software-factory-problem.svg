<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Inter, Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <filter id="softP" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#111827" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="#F4F5F9"/>

  <!-- Header -->
  <text x="80" y="66" font-size="12" font-weight="700" fill="#6D28D9" letter-spacing="2.2">SOFTWARE FACTORY · THE PROBLEM</text>
  <text x="80" y="114" font-size="40" font-weight="700" fill="#111827">Same bug. Same developer. One week or one morning.</text>
  <text x="80" y="148" font-size="16.5" fill="#4B5563">A customer in Berlin is charged the wrong VAT. Here is how that fix happens today — and with openJiuwen Works.</text>

  <!-- The bug -->
  <rect x="80" y="178" width="1440" height="76" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#softP)"/>
  <text x="104" y="206" font-size="11" font-weight="700" fill="#9CA3AF" letter-spacing="1.4">THE BUG</text>
  <text x="104" y="236" font-size="17" fill="#111827">“My invoice shows 21% VAT. It should be 19%.”</text>
  <text x="620" y="236" font-size="15" fill="#6B7280">— a customer in Berlin, Monday 09:00</text>

  <!-- TODAY -->
  <rect x="80" y="276" width="700" height="404" rx="18" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#softP)"/>
  <text x="104" y="312" font-size="11" font-weight="700" fill="#9CA3AF" letter-spacing="1.6">TODAY</text>
  <text x="104" y="356" font-size="30" font-weight="700" fill="#6B7280">4 days</text>

  <line x1="204" y1="404" x2="204" y2="646" stroke="#E5E7EB" stroke-width="2"/>

  <circle cx="204" cy="416" r="4" fill="#9CA3AF"/>
  <text x="186" y="421" font-size="12" font-family="Consolas, Menlo, monospace" fill="#9CA3AF" text-anchor="end">Mon 09:00</text>
  <text x="224" y="421" font-size="15" fill="#374151">The report sits in the tracker.</text>

  <circle cx="204" cy="471" r="4" fill="#9CA3AF"/>
  <text x="186" y="476" font-size="12" font-family="Consolas, Menlo, monospace" fill="#9CA3AF" text-anchor="end">Mon 14:00</text>
  <text x="224" y="476" font-size="15" fill="#374151">A developer has time to open it.</text>

  <circle cx="204" cy="526" r="4" fill="#9CA3AF"/>
  <text x="186" y="531" font-size="12" font-family="Consolas, Menlo, monospace" fill="#9CA3AF" text-anchor="end">Mon 15:00</text>
  <text x="224" y="531" font-size="15" fill="#374151">The coding agent asks; the developer answers between meetings.</text>

  <circle cx="204" cy="581" r="4" fill="#9CA3AF"/>
  <text x="186" y="586" font-size="12" font-family="Consolas, Menlo, monospace" fill="#9CA3AF" text-anchor="end">Tue 11:00</text>
  <text x="224" y="586" font-size="15" fill="#374151">The change waits for a reviewer.</text>

  <circle cx="204" cy="636" r="4" fill="#9CA3AF"/>
  <text x="186" y="641" font-size="12" font-family="Consolas, Menlo, monospace" fill="#9CA3AF" text-anchor="end">Fri 12:00</text>
  <text x="224" y="641" font-size="15" fill="#374151">Released. The customer hears nothing.</text>

  <!-- WITH OPENJIUWEN WORKS -->
  <rect x="820" y="276" width="700" height="404" rx="18" fill="#FBFAFF" stroke="#DDD6FE" stroke-width="2" filter="url(#softP)"/>
  <text x="844" y="312" font-size="11" font-weight="700" fill="#6D28D9" letter-spacing="1.6">WITH OPENJIUWEN WORKS</text>
  <text x="844" y="356" font-size="30" font-weight="700" fill="#6D28D9">1 h 45 min</text>

  <line x1="944" y1="404" x2="944" y2="646" stroke="#EDE9FE" stroke-width="2"/>

  <circle cx="944" cy="416" r="4" fill="#6D28D9"/>
  <text x="926" y="421" font-size="12" font-family="Consolas, Menlo, monospace" fill="#6D28D9" text-anchor="end">Mon 09:00</text>
  <text x="964" y="421" font-size="15" fill="#374151">The signal arrives; the engine finds the code.</text>

  <circle cx="944" cy="471" r="4" fill="#6D28D9"/>
  <text x="926" y="476" font-size="12" font-family="Consolas, Menlo, monospace" fill="#6D28D9" text-anchor="end">Mon 09:20</text>
  <text x="964" y="476" font-size="15" fill="#374151">The developer approves the plan — one click.</text>

  <circle cx="944" cy="526" r="4" fill="#6D28D9"/>
  <text x="926" y="531" font-size="12" font-family="Consolas, Menlo, monospace" fill="#6D28D9" text-anchor="end">Mon 10:30</text>
  <text x="964" y="531" font-size="15" fill="#374151">Built in a sandbox, checked with hidden tests.</text>

  <circle cx="944" cy="581" r="4" fill="#6D28D9"/>
  <text x="926" y="586" font-size="12" font-family="Consolas, Menlo, monospace" fill="#6D28D9" text-anchor="end">Mon 10:40</text>
  <text x="964" y="586" font-size="15" fill="#374151">The developer reads one page and releases.</text>

  <circle cx="944" cy="636" r="4" fill="#6D28D9"/>
  <text x="926" y="641" font-size="12" font-family="Consolas, Menlo, monospace" fill="#6D28D9" text-anchor="end">Mon 10:45</text>
  <text x="964" y="641" font-size="15" fill="#374151">The fix ships; the customer gets a reply.</text>

  <!-- Footer -->
  <line x1="80" y1="726" x2="1520" y2="726" stroke="#DDE2E8" stroke-width="1.5"/>
  <text x="80" y="762" font-size="16" fill="#111827">Same customer, same developer, same code — the waiting moved to the engine.</text>
  <text x="1520" y="762" font-size="12.5" fill="#9CA3AF" text-anchor="end">Illustrative example</text>
  <text x="80" y="812" font-size="13" fill="#6B7280">The same two decisions happen in both paths: agree the plan, approve the release. Today they are buried in a queue.</text>
</svg>
