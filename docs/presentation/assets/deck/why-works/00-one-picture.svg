<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Inter, Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <filter id="o1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#111827" flood-opacity="0.07"/>
    </filter>
    <marker id="oa1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1600" height="900" fill="#F4F5F9"/>

  <text x="100" y="88" font-size="13" font-weight="700" fill="#6D28D9" letter-spacing="2.4">ONE PICTURE</text>
  <text x="100" y="152" font-size="46" font-weight="700" fill="#111827">Three kinds of done.</text>
  <text x="100" y="196" font-size="19" fill="#6B7280">Orbit, a Swarm leader and Works are not three versions of one product. They are three different steps.</text>

  <!-- step 1 -->
  <rect x="100" y="680" width="280" height="82" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="2" filter="url(#o1)"/>
  <text x="122" y="716" font-size="21" font-weight="700" fill="#111827">1 · Agreed</text>
  <text x="122" y="744" font-size="13" font-weight="700" fill="#0F766E">Orbit · the room</text>

  <circle cx="190" cy="612" r="13" fill="none" stroke="#0F766E" stroke-width="2"/>
  <line x1="190" y1="625" x2="190" y2="658" stroke="#0F766E" stroke-width="2.4"/>
  <line x1="190" y1="636" x2="172" y2="650" stroke="#0F766E" stroke-width="2.4"/>
  <line x1="190" y1="636" x2="208" y2="650" stroke="#0F766E" stroke-width="2.4"/>
  <circle cx="252" cy="612" r="13" fill="none" stroke="#0F766E" stroke-width="2"/>
  <line x1="252" y1="625" x2="252" y2="658" stroke="#0F766E" stroke-width="2.4"/>
  <line x1="252" y1="636" x2="234" y2="650" stroke="#0F766E" stroke-width="2.4"/>
  <line x1="252" y1="636" x2="270" y2="650" stroke="#0F766E" stroke-width="2.4"/>
  <rect x="160" y="548" width="86" height="42" rx="12" fill="#F0FDFA" stroke="#99F6E4"/>
  <path d="M176 590 L176 602 L190 590" fill="#F0FDFA" stroke="#99F6E4"/>
  <rect x="262" y="548" width="70" height="42" rx="12" fill="#F0FDFA" stroke="#99F6E4"/>

  <!-- step 2 -->
  <rect x="420" y="590" width="300" height="172" rx="10" fill="#FFFFFF" stroke="#334155" stroke-width="2" filter="url(#o1)"/>
  <text x="442" y="608" font-size="21" font-weight="700" fill="#111827">2 · Built</text>
  <text x="442" y="636" font-size="13" font-weight="700" fill="#334155">Swarm · leader and subagents</text>
  <text x="442" y="704" font-size="13" fill="#6B7280">the leader owns the work</text>

  <circle cx="570" cy="474" r="14" fill="none" stroke="#334155" stroke-width="2"/>
  <line x1="570" y1="488" x2="570" y2="520" stroke="#334155" stroke-width="2.4"/>
  <line x1="570" y1="500" x2="552" y2="512" stroke="#334155" stroke-width="2.4"/>
  <line x1="570" y1="500" x2="588" y2="512" stroke="#334155" stroke-width="2.4"/>
  <line x1="570" y1="520" x2="516" y2="548" stroke="#94A3B8" stroke-width="2"/>
  <line x1="570" y1="520" x2="570" y2="548" stroke="#94A3B8" stroke-width="2"/>
  <line x1="570" y1="520" x2="624" y2="548" stroke="#94A3B8" stroke-width="2"/>
  <g stroke="#334155" stroke-width="2" fill="none">
    <circle cx="516" cy="556" r="8"/>
    <line x1="516" y1="564" x2="516" y2="584"/>
    <line x1="516" y1="571" x2="506" y2="580"/>
    <line x1="516" y1="571" x2="526" y2="580"/>
    <circle cx="570" cy="556" r="8"/>
    <line x1="570" y1="564" x2="570" y2="584"/>
    <line x1="570" y1="571" x2="560" y2="580"/>
    <line x1="570" y1="571" x2="580" y2="580"/>
    <circle cx="624" cy="556" r="8"/>
    <line x1="624" y1="564" x2="624" y2="584"/>
    <line x1="624" y1="571" x2="614" y2="580"/>
    <line x1="624" y1="571" x2="634" y2="580"/>
  </g>

  <!-- step 3 -->
  <rect x="760" y="430" width="320" height="332" rx="10" fill="#FFFFFF" stroke="#6D28D9" stroke-width="2" filter="url(#o1)"/>
  <text x="782" y="468" font-size="21" font-weight="700" fill="#111827">3 · Proven</text>
  <text x="782" y="496" font-size="21" font-weight="700" fill="#111827">and signed</text>
  <text x="782" y="526" font-size="13" font-weight="700" fill="#6D28D9">Works · delivery</text>
  <text x="782" y="570" font-size="13" fill="#6B7280">the proof is bound to the commit</text>
  <g transform="rotate(-6 920 670)">
    <rect x="820" y="625" width="200" height="70" rx="8" fill="none" stroke="#6D28D9" stroke-width="3" opacity="0.75"/>
    <text x="920" y="671" font-size="20" font-weight="700" fill="#6D28D9" text-anchor="middle" opacity="0.85">VERIFIED</text>
  </g>

  <rect x="862" y="316" width="116" height="96" rx="8" fill="#F5F3FF" stroke="#6D28D9" stroke-width="2"/>
  <line x1="880" y1="338" x2="960" y2="338" stroke="#C4B5FD" stroke-width="2"/>
  <line x1="880" y1="354" x2="960" y2="354" stroke="#C4B5FD" stroke-width="2"/>
  <line x1="880" y1="370" x2="940" y2="370" stroke="#C4B5FD" stroke-width="2"/>
  <rect x="872" y="386" width="44" height="18" rx="4" fill="none" stroke="#6D28D9" stroke-width="1.8" transform="rotate(-7 894 395)"/>
  <rect x="930" y="386" width="44" height="18" rx="4" fill="none" stroke="#6D28D9" stroke-width="1.8" transform="rotate(6 952 395)"/>

  <!-- flow arrows -->
  <line x1="386" y1="700" x2="414" y2="700" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#oa1)"/>
  <line x1="726" y1="600" x2="754" y2="600" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#oa1)"/>

  <!-- why panel -->
  <rect x="1120" y="290" width="380" height="472" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#o1)"/>
  <text x="1148" y="332" font-size="12" font-weight="700" fill="#9CA3AF" letter-spacing="1.4">WHAT IT GIVES YOU</text>
  <text x="1148" y="372" font-size="19" font-weight="700" fill="#111827">Only the third step can be</text>
  <text x="1148" y="398" font-size="19" font-weight="700" fill="#111827">shown</text>
  <g font-size="16" fill="#374151">
    <circle cx="1158" cy="430" r="9" fill="#ECFDF5" stroke="#047857" stroke-width="1.5"/>
    <path d="M1153 430 L1157 434 L1164 426" fill="none" stroke="#047857" stroke-width="2" stroke-linecap="round"/>
    <text x="1178" y="436">to a customer</text>
    <circle cx="1158" cy="464" r="9" fill="#ECFDF5" stroke="#047857" stroke-width="1.5"/>
    <path d="M1153 464 L1157 468 L1164 460" fill="none" stroke="#047857" stroke-width="2" stroke-linecap="round"/>
    <text x="1178" y="470">to an auditor</text>
    <circle cx="1158" cy="498" r="9" fill="#ECFDF5" stroke="#047857" stroke-width="1.5"/>
    <path d="M1153 498 L1157 502 L1164 494" fill="none" stroke="#047857" stroke-width="2" stroke-linecap="round"/>
    <text x="1178" y="504">to your manager</text>
  </g>
  <line x1="1148" y1="534" x2="1472" y2="534" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="1148" y="570" font-size="17" font-weight="700" fill="#B91C1C">A leader cannot sign</text>
  <text x="1148" y="594" font-size="17" font-weight="700" fill="#B91C1C">their own work.</text>
  <text x="1148" y="626" font-size="14" fill="#6B7280">The proof is owned by</text>
  <text x="1148" y="646" font-size="14" fill="#6B7280">someone outside the team.</text>
  <text x="1148" y="704" font-size="15" font-weight="700" fill="#6D28D9">Without the third step it is a demo.</text>

  <text x="800" y="806" font-size="19" fill="#475569" text-anchor="middle">Orbit leaves a conversation. Swarm leaves code. Works leaves a proof.</text>

  <line x1="100" y1="840" x2="1500" y2="840" stroke="#DDE2E8" stroke-width="1.5"/>
  <text x="100" y="870" font-size="12" fill="#9CA3AF">openJiuwen Works · 2026</text>
  <text x="1500" y="870" font-size="12" fill="#9CA3AF" text-anchor="end">one picture</text>
</svg>
