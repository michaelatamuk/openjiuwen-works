<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Inter, Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <filter id="s1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#111827" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1600" height="900" fill="#F4F5F9"/>

  <text x="100" y="90" font-size="13" font-weight="700" fill="#6D28D9" letter-spacing="2.4">WHY THESE ARE NOT THE SAME</text>
  <text x="100" y="160" font-size="46" font-weight="700" fill="#111827">Three products. One word: agents.</text>
  <text x="100" y="205" font-size="19" fill="#6B7280">So it looks like we build the same thing three times. We do not.</text>

  <g>
    <rect x="100" y="270" width="420" height="450" rx="18" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#s1)"/>
    <circle cx="310" cy="340" r="6" fill="#94A3B8"/>
    <line x1="310" y1="346" x2="310" y2="366" stroke="#94A3B8" stroke-width="3"/>
    <rect x="255" y="366" width="110" height="92" rx="20" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
    <circle cx="290" cy="408" r="7" fill="#64748B"/>
    <circle cx="330" cy="408" r="7" fill="#64748B"/>
    <line x1="292" y1="434" x2="328" y2="434" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <rect x="275" y="470" width="70" height="76" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
    <line x1="275" y1="490" x2="245" y2="520" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <line x1="345" y1="490" x2="375" y2="520" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <text x="310" y="610" font-size="24" font-weight="700" fill="#0F766E" text-anchor="middle">ORBIT</text>
    <text x="310" y="640" font-size="14" fill="#6B7280" text-anchor="middle">the room</text>
  </g>

  <g>
    <rect x="590" y="270" width="420" height="450" rx="18" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#s1)"/>
    <circle cx="800" cy="340" r="6" fill="#94A3B8"/>
    <line x1="800" y1="346" x2="800" y2="366" stroke="#94A3B8" stroke-width="3"/>
    <rect x="745" y="366" width="110" height="92" rx="20" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
    <circle cx="780" cy="408" r="7" fill="#64748B"/>
    <circle cx="820" cy="408" r="7" fill="#64748B"/>
    <line x1="782" y1="434" x2="818" y2="434" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <rect x="765" y="470" width="70" height="76" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
    <line x1="765" y1="490" x2="735" y2="520" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <line x1="835" y1="490" x2="865" y2="520" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <text x="800" y="610" font-size="24" font-weight="700" fill="#334155" text-anchor="middle">SWARM</text>
    <text x="800" y="640" font-size="14" fill="#6B7280" text-anchor="middle">leader + subagents</text>
  </g>

  <g>
    <rect x="1080" y="270" width="420" height="450" rx="18" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#s1)"/>
    <circle cx="1290" cy="340" r="6" fill="#94A3B8"/>
    <line x1="1290" y1="346" x2="1290" y2="366" stroke="#94A3B8" stroke-width="3"/>
    <rect x="1235" y="366" width="110" height="92" rx="20" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
    <circle cx="1270" cy="408" r="7" fill="#64748B"/>
    <circle cx="1310" cy="408" r="7" fill="#64748B"/>
    <line x1="1272" y1="434" x2="1308" y2="434" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <rect x="1255" y="470" width="70" height="76" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
    <line x1="1255" y1="490" x2="1225" y2="520" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <line x1="1325" y1="490" x2="1355" y2="520" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <text x="1290" y="610" font-size="24" font-weight="700" fill="#6D28D9" text-anchor="middle">WORKS</text>
    <text x="1290" y="640" font-size="14" fill="#6B7280" text-anchor="middle">delivery</text>
  </g>

  <text x="800" y="790" font-size="20" fill="#475569" text-anchor="middle">For now all three look the same. The difference comes next.</text>

  <line x1="100" y1="830" x2="1500" y2="830" stroke="#DDE2E8" stroke-width="1.5"/>
  <text x="100" y="862" font-size="13" fill="#9CA3AF">openJiuwen Works · 2026</text>
  <text x="1500" y="862" font-size="13" fill="#9CA3AF" text-anchor="end">1 / 7</text>
</svg>
