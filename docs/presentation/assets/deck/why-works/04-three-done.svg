<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Inter, Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <filter id="s4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#111827" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1600" height="900" fill="#F4F5F9"/>

  <text x="100" y="90" font-size="13" font-weight="700" fill="#6D28D9" letter-spacing="2.4">THREE KINDS OF DONE</text>
  <text x="100" y="160" font-size="46" font-weight="700" fill="#111827">“Done” is three different words.</text>
  <text x="100" y="205" font-size="19" fill="#6B7280">Only the third step can be shown to a customer, an auditor and your manager.</text>

  <rect x="140" y="650" width="380" height="100" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="2" filter="url(#s4)"/>
  <text x="170" y="690" font-size="22" font-weight="700" fill="#111827">1 · Agreed</text>
  <text x="170" y="720" font-size="14" font-weight="700" fill="#0F766E">Orbit</text>

  <rect x="560" y="560" width="380" height="190" rx="10" fill="#FFFFFF" stroke="#334155" stroke-width="2" filter="url(#s4)"/>
  <text x="590" y="600" font-size="22" font-weight="700" fill="#111827">2 · Built</text>
  <text x="590" y="630" font-size="14" font-weight="700" fill="#334155">Swarm · leader</text>

  <rect x="980" y="470" width="380" height="280" rx="10" fill="#FFFFFF" stroke="#6D28D9" stroke-width="2" filter="url(#s4)"/>
  <text x="1010" y="510" font-size="22" font-weight="700" fill="#111827">3 · Proven</text>
  <text x="1010" y="540" font-size="22" font-weight="700" fill="#111827">and signed</text>
  <text x="1010" y="572" font-size="14" font-weight="700" fill="#6D28D9">Works</text>

  <line x1="1330" y1="470" x2="1330" y2="370" stroke="#6D28D9" stroke-width="4"/>
  <path d="M1330 370 L1424 396 L1330 422 Z" fill="#6D28D9"/>

  <text x="800" y="790" font-size="20" fill="#475569" text-anchor="middle">Agreed is not built. Built is not proven.</text>

  <line x1="100" y1="830" x2="1500" y2="830" stroke="#DDE2E8" stroke-width="1.5"/>
  <text x="100" y="862" font-size="13" fill="#9CA3AF">openJiuwen Works · 2026</text>
  <text x="1500" y="862" font-size="13" fill="#9CA3AF" text-anchor="end">4 / 7</text>
</svg>
