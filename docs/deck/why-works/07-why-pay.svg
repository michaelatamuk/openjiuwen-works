<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Inter, Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <filter id="s7" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#111827" flood-opacity="0.07"/>
    </filter>
    <marker id="a7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6D28D9"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1600" height="900" fill="#F4F5F9"/>

  <text x="100" y="90" font-size="13" font-weight="700" fill="#6D28D9" letter-spacing="2.4">WHY PAY FOR THIS</text>
  <text x="100" y="160" font-size="46" font-weight="700" fill="#111827">Capacity does not scale without trust.</text>
  <text x="100" y="205" font-size="19" fill="#6B7280">Agents stay a demo until their work becomes provable and signed.</text>

  <g>
    <rect x="100" y="290" width="400" height="230" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#s7)"/>
    <text x="300" y="330" font-size="12" font-weight="700" fill="#475569" text-anchor="middle" letter-spacing="1.6">SWARM</text>
    <text x="300" y="395" font-size="28" font-weight="700" fill="#111827" text-anchor="middle">CAPACITY</text>
    <text x="300" y="432" font-size="16" fill="#6B7280" text-anchor="middle">leader and subagents</text>
  </g>

  <text x="530" y="425" font-size="40" fill="#94A3B8" text-anchor="middle">+</text>

  <g>
    <rect x="560" y="290" width="400" height="230" rx="16" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1.5" filter="url(#s7)"/>
    <text x="760" y="330" font-size="12" font-weight="700" fill="#0F766E" text-anchor="middle" letter-spacing="1.6">ORBIT</text>
    <text x="760" y="395" font-size="28" font-weight="700" fill="#111827" text-anchor="middle">COORDINATION</text>
    <text x="760" y="432" font-size="16" fill="#6B7280" text-anchor="middle">people and chats together</text>
  </g>

  <text x="990" y="425" font-size="40" fill="#94A3B8" text-anchor="middle">+</text>

  <g>
    <rect x="1020" y="290" width="400" height="230" rx="16" fill="#FFFFFF" stroke="#6D28D9" stroke-width="1.5" filter="url(#s7)"/>
    <text x="1220" y="330" font-size="12" font-weight="700" fill="#6D28D9" text-anchor="middle" letter-spacing="1.6">WORKS</text>
    <text x="1220" y="395" font-size="28" font-weight="700" fill="#111827" text-anchor="middle">TRUST</text>
    <text x="1220" y="432" font-size="16" fill="#6B7280" text-anchor="middle">proven and signed</text>
  </g>

  <line x1="800" y1="555" x2="800" y2="615" stroke="#6D28D9" stroke-width="3" marker-end="url(#a7)"/>

  <rect x="280" y="630" width="1040" height="84" rx="14" fill="#F5F3FF" stroke="#6D28D9" stroke-width="2"/>
  <text x="800" y="682" font-size="24" font-weight="700" fill="#5B21B6" text-anchor="middle">work that can be shipped</text>

  <text x="800" y="770" font-size="18" fill="#475569" text-anchor="middle">A demo becomes a process someone stands behind.</text>

  <line x1="100" y1="830" x2="1500" y2="830" stroke="#DDE2E8" stroke-width="1.5"/>
  <text x="100" y="862" font-size="13" fill="#9CA3AF">openJiuwen Works · 2026</text>
  <text x="1500" y="862" font-size="13" fill="#9CA3AF" text-anchor="end">7 / 7</text>
</svg>
