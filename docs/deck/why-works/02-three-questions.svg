<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Inter, Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <filter id="s2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#111827" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1600" height="900" fill="#F4F5F9"/>

  <text x="100" y="90" font-size="13" font-weight="700" fill="#6D28D9" letter-spacing="2.4">THREE DIFFERENT QUESTIONS</text>
  <text x="100" y="160" font-size="46" font-weight="700" fill="#111827">These are not three versions of one product.</text>
  <text x="100" y="205" font-size="19" fill="#6B7280">Each answers a different question, so none replaces another.</text>

  <g>
    <rect x="100" y="270" width="420" height="460" rx="18" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#s2)"/>
    <text x="310" y="315" font-size="13" font-weight="700" fill="#0F766E" text-anchor="middle" letter-spacing="1.6">ORBIT</text>
    <path d="M250 570 L250 420 A60 60 0 0 1 370 420 L370 570 Z" fill="#F0FDFA" stroke="#0F766E" stroke-width="3"/>
    <circle cx="350" cy="493" r="6" fill="#0F766E"/>
    <text x="310" y="625" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">Who, with whom, about what?</text>
    <text x="310" y="658" font-size="15" fill="#6B7280" text-anchor="middle">they agree</text>
  </g>

  <g>
    <rect x="590" y="270" width="420" height="460" rx="18" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#s2)"/>
    <text x="800" y="315" font-size="13" font-weight="700" fill="#475569" text-anchor="middle" letter-spacing="1.6">SWARM · LEADER</text>
    <path d="M740 570 L740 420 A60 60 0 0 1 860 420 L860 570 Z" fill="#F8FAFC" stroke="#334155" stroke-width="3"/>
    <circle cx="840" cy="493" r="6" fill="#334155"/>
    <text x="800" y="625" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">How should the work be split?</text>
    <text x="800" y="658" font-size="15" fill="#6B7280" text-anchor="middle">leader and subagents</text>
  </g>

  <g>
    <rect x="1080" y="270" width="420" height="460" rx="18" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#s2)"/>
    <text x="1290" y="315" font-size="13" font-weight="700" fill="#6D28D9" text-anchor="middle" letter-spacing="1.6">WORKS</text>
    <path d="M1230 570 L1230 420 A60 60 0 0 1 1350 420 L1350 570 Z" fill="#F5F3FF" stroke="#6D28D9" stroke-width="3"/>
    <circle cx="1330" cy="493" r="6" fill="#6D28D9"/>
    <text x="1290" y="625" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">How is it proven?</text>
    <text x="1290" y="658" font-size="15" fill="#6B7280" text-anchor="middle">they accept</text>
  </g>

  <text x="800" y="795" font-size="20" fill="#475569" text-anchor="middle">The same agent. Different questions, different consequences.</text>

  <line x1="100" y1="830" x2="1500" y2="830" stroke="#DDE2E8" stroke-width="1.5"/>
  <text x="100" y="862" font-size="13" fill="#9CA3AF">openJiuwen Works · 2026</text>
  <text x="1500" y="862" font-size="13" fill="#9CA3AF" text-anchor="end">2 / 7</text>
</svg>
