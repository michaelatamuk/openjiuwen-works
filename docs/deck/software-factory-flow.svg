<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Inter, Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <filter id="softF" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#111827" flood-opacity="0.07"/>
    </filter>
    <marker id="arrowF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6D28D9"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="#F4F5F9"/>

  <!-- Header -->
  <text x="90" y="66" font-size="12" font-weight="700" fill="#6D28D9" letter-spacing="2.2">OPENJIUWEN WORKS · THE FLOW</text>
  <text x="90" y="116" font-size="42" font-weight="700" fill="#111827">Ten boxes, two gates</text>
  <text x="90" y="152" font-size="17" fill="#4B5563">Every fix takes the same path. The engine runs eight steps; people decide at two.</text>

  <!-- Row 1 -->
  <rect x="90" y="250" width="260" height="120" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#softF)"/>
  <text x="110" y="288" font-size="12.5" font-weight="700" fill="#6D28D9">1</text>
  <text x="110" y="322" font-size="16.5" font-weight="700" fill="#111827">Read the signal</text>
  <text x="110" y="346" font-size="12.5" fill="#6B7280">three intakes, one work item</text>

  <rect x="380" y="250" width="260" height="120" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#softF)"/>
  <text x="400" y="288" font-size="12.5" font-weight="700" fill="#6D28D9">2</text>
  <text x="400" y="322" font-size="16.5" font-weight="700" fill="#111827">Find the code</text>
  <text x="400" y="346" font-size="12.5" fill="#6B7280">product to repository</text>

  <rect x="670" y="250" width="260" height="120" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#softF)"/>
  <text x="690" y="288" font-size="12.5" font-weight="700" fill="#B45309">3</text>
  <text x="690" y="322" font-size="16.5" font-weight="700" fill="#111827">Plan the fix</text>
  <text x="690" y="346" font-size="12.5" fill="#6B7280">gate 1 — a person agrees</text>
  <rect x="846" y="266" width="64" height="20" rx="10" fill="#FEF3C7"/>
  <text x="878" y="280" font-size="9.5" font-weight="700" fill="#B45309" text-anchor="middle" letter-spacing="0.8">GATE</text>

  <rect x="960" y="250" width="260" height="120" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#softF)"/>
  <text x="980" y="288" font-size="12.5" font-weight="700" fill="#6D28D9">4</text>
  <text x="980" y="322" font-size="16.5" font-weight="700" fill="#111827">Build it</text>
  <text x="980" y="346" font-size="12.5" fill="#6B7280">one worktree per task</text>

  <rect x="1250" y="250" width="260" height="120" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#softF)"/>
  <text x="1270" y="288" font-size="12.5" font-weight="700" fill="#6D28D9">5</text>
  <text x="1270" y="322" font-size="16.5" font-weight="700" fill="#111827">Check it</text>
  <text x="1270" y="346" font-size="12.5" fill="#6B7280">hidden tests, fresh agent</text>

  <!-- Row 1 arrows -->
  <line x1="354" y1="310" x2="376" y2="310" stroke="#6D28D9" stroke-width="2.5" marker-end="url(#arrowF)"/>
  <line x1="644" y1="310" x2="666" y2="310" stroke="#6D28D9" stroke-width="2.5" marker-end="url(#arrowF)"/>
  <line x1="934" y1="310" x2="956" y2="310" stroke="#6D28D9" stroke-width="2.5" marker-end="url(#arrowF)"/>
  <line x1="1224" y1="310" x2="1246" y2="310" stroke="#6D28D9" stroke-width="2.5" marker-end="url(#arrowF)"/>

  <!-- Turn down -->
  <line x1="1380" y1="374" x2="1380" y2="466" stroke="#6D28D9" stroke-width="2.5" marker-end="url(#arrowF)"/>

  <!-- Row 2 -->
  <rect x="1250" y="470" width="260" height="120" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#softF)"/>
  <text x="1270" y="508" font-size="12.5" font-weight="700" fill="#6D28D9">6</text>
  <text x="1270" y="542" font-size="16.5" font-weight="700" fill="#111827">Write the proof</text>
  <text x="1270" y="566" font-size="12.5" fill="#6B7280">one page, plain words</text>

  <rect x="960" y="470" width="260" height="120" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#softF)"/>
  <text x="980" y="508" font-size="12.5" font-weight="700" fill="#B45309">7</text>
  <text x="980" y="542" font-size="16.5" font-weight="700" fill="#111827">Hand it over</text>
  <text x="980" y="566" font-size="12.5" fill="#6B7280">gate 2 — a person releases</text>
  <rect x="1136" y="486" width="64" height="20" rx="10" fill="#FEF3C7"/>
  <text x="1168" y="500" font-size="9.5" font-weight="700" fill="#B45309" text-anchor="middle" letter-spacing="0.8">GATE</text>

  <rect x="670" y="470" width="260" height="120" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#softF)"/>
  <text x="690" y="508" font-size="12.5" font-weight="700" fill="#6D28D9">8</text>
  <text x="690" y="542" font-size="16.5" font-weight="700" fill="#111827">Ship it</text>
  <text x="690" y="566" font-size="12.5" fill="#6B7280">to the app, tracker or person</text>

  <rect x="380" y="470" width="260" height="120" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#softF)"/>
  <text x="400" y="508" font-size="12.5" font-weight="700" fill="#6D28D9">9</text>
  <text x="400" y="542" font-size="16.5" font-weight="700" fill="#111827">Confirm it</text>
  <text x="400" y="566" font-size="12.5" fill="#6B7280">re-run, close the report</text>

  <rect x="90" y="470" width="260" height="120" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#softF)"/>
  <text x="110" y="508" font-size="12.5" font-weight="700" fill="#6D28D9">10</text>
  <text x="110" y="542" font-size="16.5" font-weight="700" fill="#111827">Record it</text>
  <text x="110" y="566" font-size="12.5" fill="#6B7280">cost, speed, quality</text>

  <!-- Row 2 arrows (right to left) -->
  <line x1="1246" y1="530" x2="1224" y2="530" stroke="#6D28D9" stroke-width="2.5" marker-end="url(#arrowF)"/>
  <line x1="956" y1="530" x2="934" y2="530" stroke="#6D28D9" stroke-width="2.5" marker-end="url(#arrowF)"/>
  <line x1="666" y1="530" x2="644" y2="530" stroke="#6D28D9" stroke-width="2.5" marker-end="url(#arrowF)"/>
  <line x1="376" y1="530" x2="354" y2="530" stroke="#6D28D9" stroke-width="2.5" marker-end="url(#arrowF)"/>

  <!-- Return rail -->
  <path d="M 90 530 L 68 530 L 68 310 L 86 310" fill="none" stroke="#6D28D9" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrowF)"/>
  <text x="56" y="430" transform="rotate(-90 56 430)" font-size="11.5" fill="#6D28D9" text-anchor="middle">next signal</text>

  <!-- product chips: what each product does at that step -->
  <rect x="102" y="382" width="132" height="24" rx="12" fill="#FBFAFF" stroke="#DDD6FE" stroke-width="1"/>
  <text x="168" y="398" font-size="10.5" font-weight="700" fill="#6D28D9" text-anchor="middle">PPMA stores the item</text>

  <rect x="972" y="382" width="124" height="24" rx="12" fill="#FBFAFF" stroke="#DDD6FE" stroke-width="1"/>
  <text x="1034" y="398" font-size="10.5" font-weight="700" fill="#6D28D9" text-anchor="middle">jiuwenswarm builds</text>

  <rect x="1262" y="382" width="112" height="24" rx="12" fill="#FBFAFF" stroke="#DDD6FE" stroke-width="1"/>
  <text x="1318" y="398" font-size="10.5" font-weight="700" fill="#6D28D9" text-anchor="middle">agent-core checks</text>

  <rect x="1262" y="602" width="148" height="24" rx="12" fill="#FBFAFF" stroke="#DDD6FE" stroke-width="1"/>
  <text x="1336" y="618" font-size="10.5" font-weight="700" fill="#6D28D9" text-anchor="middle">Orbit shares (optional)</text>

  <rect x="690" y="382" width="170" height="24" rx="12" fill="#FBFAFF" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="775" y="398" font-size="10.5" font-weight="700" fill="#6D28D9" text-anchor="middle">LAIX decides the plan gate</text>

  <rect x="980" y="602" width="170" height="24" rx="12" fill="#FBFAFF" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="1065" y="618" font-size="10.5" font-weight="700" fill="#6D28D9" text-anchor="middle">LAIX decides the release gate</text>

  <!-- Footer -->
  <line x1="90" y1="700" x2="1510" y2="700" stroke="#DDE2E8" stroke-width="1.5"/>
  <text x="90" y="736" font-size="17" fill="#111827">Two gates, eight automatic steps, one engine.</text>
  <text x="1510" y="736" font-size="13" fill="#9CA3AF" text-anchor="end">The fix closes at the source it came from.</text>
  <text x="90" y="786" font-size="13" fill="#6B7280">A second flow is a different file, not a different engine.</text>
  <text x="1510" y="786" font-size="13" fill="#9CA3AF" text-anchor="end">Chips: product per step. LAIX decides the gates.</text>
</svg>
