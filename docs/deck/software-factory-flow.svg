<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Inter, Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <filter id="softF" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#111827" flood-opacity="0.07"/>
    </filter>
    <marker id="arrowF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6D28D9"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="#F4F5F9"/>

  <!-- Header -->
  <text x="90" y="66" font-size="12" font-weight="700" fill="#6D28D9" letter-spacing="2.2">OPENJIUWEN WORKS · THE FLOW</text>
  <text x="90" y="116" font-size="42" font-weight="700" fill="#111827">From signal to released fix</text>
  <text x="90" y="152" font-size="17" fill="#4B5563">A signal enters from a product, a tracker or a person. The engine runs eight steps; people decide at two.</text>

  <!-- Source 0: outside the engine -->
  <rect x="90" y="180" width="260" height="120" rx="14" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5" stroke-dasharray="7 5" filter="url(#softF)"/>
  <text x="110" y="211" font-size="12.5" font-weight="700" fill="#6D28D9">0</text>
  <text x="330" y="211" font-size="9.5" font-weight="700" fill="#9CA3AF" text-anchor="end" letter-spacing="1">SOURCE · OUTSIDE THE ENGINE</text>
  <text x="110" y="245" font-size="16.5" font-weight="700" fill="#111827">Where the signal comes from</text>
  <text x="110" y="271" font-size="12.5" fill="#6B7280">DigitalMate, a tracker or a person.</text>
  <text x="110" y="291" font-size="12.5" fill="#6B7280">An alert or a filed bug.</text>

  <!-- The engine boundary (a gap lets the signal arrow enter) -->
  <rect x="40" y="320" width="1500" height="402" rx="20" fill="#F8F9FC"/>
  <path d="M 240 320 L 1520 320 A 20 20 0 0 1 1540 340 L 1540 702 A 20 20 0 0 1 1520 722 L 60 722 A 20 20 0 0 1 40 702 L 40 340 A 20 20 0 0 1 60 320 L 200 320" fill="none" stroke="#D1D5DB" stroke-width="1.5"/>
  <rect x="198" y="316" width="44" height="8" fill="#F8F9FC"/>

  <!-- 0 -> engine, through the port -->
  <line x1="220" y1="300" x2="220" y2="361" stroke="#6D28D9" stroke-width="2.5" marker-end="url(#arrowF)"/>
  <text x="232" y="314" font-size="10.5" font-weight="700" fill="#6D28D9">signal</text>

  <!-- Engine label, above the whole box -->
  <text x="790" y="306" font-size="11" font-weight="700" fill="#6D28D9" text-anchor="middle" letter-spacing="1.6">THE ENGINE OF OPENJIUWEN WORKS</text>

  <!-- Row 1 -->
  <rect x="90" y="365" width="260" height="120" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#softF)"/>
  <text x="110" y="403" font-size="12.5" font-weight="700" fill="#6D28D9">1</text>
  <text x="110" y="437" font-size="16.5" font-weight="700" fill="#111827">Read the signal</text>
  <text x="110" y="461" font-size="12.5" fill="#6B7280">three intakes, one work item</text>

  <rect x="380" y="365" width="260" height="120" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#softF)"/>
  <text x="400" y="403" font-size="12.5" font-weight="700" fill="#6D28D9">2</text>
  <text x="400" y="437" font-size="16.5" font-weight="700" fill="#111827">Find the code</text>
  <text x="400" y="461" font-size="12.5" fill="#6B7280">product to repository</text>

  <rect x="670" y="365" width="260" height="120" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#softF)"/>
  <text x="690" y="403" font-size="12.5" font-weight="700" fill="#B45309">3</text>
  <text x="690" y="437" font-size="16.5" font-weight="700" fill="#111827">Plan the fix</text>
  <text x="690" y="461" font-size="12.5" fill="#6B7280">gate 1 — a person agrees</text>
  <rect x="846" y="381" width="64" height="20" rx="10" fill="#FEF3C7"/>
  <text x="878" y="395" font-size="9.5" font-weight="700" fill="#B45309" text-anchor="middle" letter-spacing="0.8">GATE</text>

  <rect x="960" y="365" width="260" height="120" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#softF)"/>
  <text x="980" y="403" font-size="12.5" font-weight="700" fill="#6D28D9">4</text>
  <text x="980" y="437" font-size="16.5" font-weight="700" fill="#111827">Build it</text>
  <text x="980" y="461" font-size="12.5" fill="#6B7280">one worktree per task</text>

  <rect x="1250" y="365" width="260" height="120" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#softF)"/>
  <text x="1270" y="403" font-size="12.5" font-weight="700" fill="#6D28D9">5</text>
  <text x="1270" y="437" font-size="16.5" font-weight="700" fill="#111827">Check it</text>
  <text x="1270" y="461" font-size="12.5" fill="#6B7280">hidden tests, fresh agent</text>

  <!-- Row 1 arrows -->
  <line x1="354" y1="425" x2="376" y2="425" stroke="#6D28D9" stroke-width="2.5" marker-end="url(#arrowF)"/>
  <line x1="644" y1="425" x2="666" y2="425" stroke="#6D28D9" stroke-width="2.5" marker-end="url(#arrowF)"/>
  <line x1="934" y1="425" x2="956" y2="425" stroke="#6D28D9" stroke-width="2.5" marker-end="url(#arrowF)"/>
  <line x1="1224" y1="425" x2="1246" y2="425" stroke="#6D28D9" stroke-width="2.5" marker-end="url(#arrowF)"/>

  <!-- Turn down -->
  <line x1="1380" y1="489" x2="1380" y2="556" stroke="#6D28D9" stroke-width="2.5" marker-end="url(#arrowF)"/>

  <!-- Row 2 -->
  <rect x="1250" y="560" width="260" height="120" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#softF)"/>
  <text x="1270" y="598" font-size="12.5" font-weight="700" fill="#6D28D9">6</text>
  <text x="1270" y="632" font-size="16.5" font-weight="700" fill="#111827">Write the proof</text>
  <text x="1270" y="656" font-size="12.5" fill="#6B7280">one page, plain words</text>

  <rect x="960" y="560" width="260" height="120" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#softF)"/>
  <text x="980" y="598" font-size="12.5" font-weight="700" fill="#B45309">7</text>
  <text x="980" y="632" font-size="16.5" font-weight="700" fill="#111827">Hand it over</text>
  <text x="980" y="656" font-size="12.5" fill="#6B7280">gate 2 — a person releases</text>
  <rect x="1136" y="576" width="64" height="20" rx="10" fill="#FEF3C7"/>
  <text x="1168" y="590" font-size="9.5" font-weight="700" fill="#B45309" text-anchor="middle" letter-spacing="0.8">GATE</text>

  <rect x="670" y="560" width="260" height="120" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#softF)"/>
  <text x="690" y="598" font-size="12.5" font-weight="700" fill="#6D28D9">8</text>
  <text x="690" y="632" font-size="16.5" font-weight="700" fill="#111827">Deliver it</text>
  <text x="690" y="656" font-size="12.5" fill="#6B7280">to the app, tracker or person</text>

  <rect x="380" y="560" width="260" height="120" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#softF)"/>
  <text x="400" y="598" font-size="12.5" font-weight="700" fill="#6D28D9">9</text>
  <text x="400" y="632" font-size="16.5" font-weight="700" fill="#111827">Confirm it</text>
  <text x="400" y="656" font-size="12.5" fill="#6B7280">re-run, close the report</text>

  <rect x="90" y="560" width="260" height="120" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#softF)"/>
  <text x="110" y="598" font-size="12.5" font-weight="700" fill="#6D28D9">10</text>
  <text x="110" y="632" font-size="16.5" font-weight="700" fill="#111827">Record it</text>
  <text x="110" y="656" font-size="12.5" fill="#6B7280">cost, speed, quality</text>

  <!-- Row 2 arrows (right to left) -->
  <line x1="1246" y1="620" x2="1224" y2="620" stroke="#6D28D9" stroke-width="2.5" marker-end="url(#arrowF)"/>
  <line x1="956" y1="620" x2="934" y2="620" stroke="#6D28D9" stroke-width="2.5" marker-end="url(#arrowF)"/>
  <line x1="666" y1="620" x2="644" y2="620" stroke="#6D28D9" stroke-width="2.5" marker-end="url(#arrowF)"/>
  <line x1="376" y1="620" x2="354" y2="620" stroke="#6D28D9" stroke-width="2.5" marker-end="url(#arrowF)"/>

  <!-- Return rail, fully inside the engine -->
  <path d="M 90 620 L 64 620 L 64 425 L 88 425" fill="none" stroke="#6D28D9" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrowF)"/>
  <text x="50" y="522" transform="rotate(-90 50 522)" font-size="11.5" fill="#6D28D9" text-anchor="middle">next signal</text>

  <!-- integration chips: what each product does at that step -->
  <rect x="102" y="497" width="132" height="24" rx="12" fill="#FBFAFF" stroke="#DDD6FE" stroke-width="1"/>
  <text x="168" y="513" font-size="10.5" font-weight="700" fill="#6D28D9" text-anchor="middle">PPMA stores the item</text>

  <rect x="972" y="497" width="124" height="24" rx="12" fill="#FBFAFF" stroke="#DDD6FE" stroke-width="1"/>
  <text x="1034" y="513" font-size="10.5" font-weight="700" fill="#6D28D9" text-anchor="middle">openjiuwen builds</text>

  <rect x="1262" y="497" width="112" height="24" rx="12" fill="#FBFAFF" stroke="#DDD6FE" stroke-width="1"/>
  <text x="1318" y="513" font-size="10.5" font-weight="700" fill="#6D28D9" text-anchor="middle">agent-core checks</text>

  <rect x="690" y="497" width="170" height="24" rx="12" fill="#FBFAFF" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="775" y="513" font-size="10.5" font-weight="700" fill="#6D28D9" text-anchor="middle">LAIX decides the plan gate</text>

  <rect x="980" y="692" width="170" height="24" rx="12" fill="#FBFAFF" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="1065" y="708" font-size="10.5" font-weight="700" fill="#6D28D9" text-anchor="middle">LAIX decides the release gate</text>

  <!-- Legend: source, engine, integration, gate -->
  <rect x="90" y="778" width="16" height="16" rx="4" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="114" y="791" font-size="12" fill="#4B5563">Source — outside the engine</text>
  <rect x="330" y="778" width="16" height="16" rx="4" fill="#F8F9FC" stroke="#D1D5DB" stroke-width="1.3"/>
  <text x="354" y="791" font-size="12" fill="#4B5563">Engine — what Works builds</text>
  <rect x="610" y="778" width="16" height="16" rx="8" fill="#FBFAFF" stroke="#DDD6FE" stroke-width="1.3"/>
  <text x="634" y="791" font-size="12" fill="#4B5563">Integration — a product it calls</text>
  <rect x="940" y="778" width="16" height="16" rx="8" fill="#FEF3C7"/>
  <text x="964" y="791" font-size="12" fill="#4B5563">Gate — a person decides</text>
  <text x="1510" y="791" font-size="12" fill="#6B7280" text-anchor="end">We build the engine; the rest are integrations.</text>

  <!-- Footer -->
  <line x1="90" y1="810" x2="1510" y2="810" stroke="#DDE2E8" stroke-width="1.5"/>
  <text x="90" y="842" font-size="17" fill="#111827">Two gates, eight automatic steps, one engine.</text>
  <text x="1510" y="842" font-size="13" fill="#9CA3AF" text-anchor="end">The fix closes at the source it came from.</text>
  <text x="90" y="872" font-size="13" fill="#6B7280">A second flow is a different file, not a different engine.</text>
  <text x="1510" y="872" font-size="13" fill="#9CA3AF" text-anchor="end">Chips: the integration at that step. LAIX decides the gates.</text>
</svg>
