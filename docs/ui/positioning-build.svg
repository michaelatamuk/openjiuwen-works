<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Inter, Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <filter id="softC" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#111827" flood-opacity="0.07"/>
    </filter>
    <marker id="tealC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0F766E"/>
    </marker>
    <marker id="violetC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6D28D9"/>
    </marker>
    <marker id="slateC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="560" fill="#F4F5F9"/>

  <text x="40" y="42" font-size="12" font-weight="700" fill="#6D28D9" letter-spacing="2">POSITIONING</text>
  <text x="40" y="86" font-size="34" font-weight="700" fill="#111827">Orbit inside one stage</text>
  <text x="40" y="114" font-size="14" fill="#6B7280">If one room should run several harnesses, put Orbit inside build — not around the factory.</text>

  <!-- lifecycle strip -->
  <g font-size="11.5">
    <rect x="40" y="146" width="104" height="30" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="92" y="166" fill="#334155" text-anchor="middle">reproduce</text>
    <rect x="156" y="146" width="104" height="30" rx="8" fill="#F5F3FF" stroke="#DDD6FE"/>
    <text x="208" y="166" fill="#5B21B6" text-anchor="middle">plan gate</text>
    <rect x="272" y="140" width="128" height="42" rx="10" fill="#6D28D9"/>
    <text x="336" y="158" fill="#FFFFFF" font-weight="700" text-anchor="middle">BUILD</text>
    <text x="336" y="174" fill="#EDE9FE" text-anchor="middle">one stage</text>
    <rect x="412" y="146" width="104" height="30" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="464" y="166" fill="#334155" text-anchor="middle">check</text>
    <rect x="528" y="146" width="104" height="30" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="580" y="166" fill="#334155" text-anchor="middle">prove</text>
    <rect x="644" y="146" width="112" height="30" rx="8" fill="#F5F3FF" stroke="#DDD6FE"/>
    <text x="700" y="166" fill="#5B21B6" text-anchor="middle">release gate</text>
    <rect x="768" y="146" width="104" height="30" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="820" y="166" fill="#334155" text-anchor="middle">deliver</text>
    <rect x="884" y="146" width="104" height="30" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="936" y="166" fill="#334155" text-anchor="middle">confirm</text>
  </g>
  <text x="1010" y="166" font-size="12" fill="#64748B">← Works owns the whole line</text>

  <!-- zoom lines -->
  <line x1="336" y1="182" x2="336" y2="216" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#slateC)"/>
  <line x1="464" y1="216" x2="464" y2="180" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#slateC)"/>
  <text x="476" y="204" font-size="11" fill="#64748B">patch and transcript go back to check</text>

  <!-- build expansion -->
  <rect x="40" y="220" width="1120" height="196" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#softC)"/>
  <text x="64" y="248" font-size="11" font-weight="700" fill="#9CA3AF" letter-spacing="1.4">INSIDE BUILD</text>

  <rect x="64" y="264" width="250" height="128" rx="12" fill="#F0FDFA" stroke="#99F6E4"/>
  <text x="86" y="292" font-size="13" font-weight="700" fill="#0F766E">ORBIT · RUNTIME MULTIPLEXER</text>
  <text x="86" y="316" font-size="12" fill="#134E4A">one room, one task, several runtimes</text>
  <text x="86" y="338" font-size="12" fill="#134E4A">routing, sessions, approvals</text>
  <text x="86" y="360" font-size="12" fill="#134E4A">a worktree per task</text>

  <line x1="318" y1="328" x2="356" y2="328" stroke="#0F766E" stroke-width="2" marker-end="url(#tealC)"/>

  <g font-size="12">
    <rect x="360" y="268" width="170" height="30" rx="15" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="445" y="288" fill="#334155" text-anchor="middle">openJiuwen</text>
    <rect x="360" y="312" width="170" height="30" rx="15" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="445" y="332" fill="#334155" text-anchor="middle">JiuwenSwarm</text>
    <rect x="360" y="356" width="170" height="30" rx="15" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="445" y="376" fill="#334155" text-anchor="middle">Claude Code</text>
    <rect x="552" y="268" width="170" height="30" rx="15" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="637" y="288" fill="#334155" text-anchor="middle">Codex</text>
    <rect x="552" y="312" width="170" height="30" rx="15" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="637" y="332" fill="#334155" text-anchor="middle">another harness</text>
    <rect x="552" y="356" width="170" height="30" rx="15" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="637" y="376" fill="#334155" text-anchor="middle">and another</text>
  </g>

  <line x1="742" y1="328" x2="780" y2="328" stroke="#6D28D9" stroke-width="2" marker-end="url(#violetC)"/>

  <rect x="784" y="264" width="352" height="128" rx="12" fill="#F5F3FF" stroke="#DDD6FE"/>
  <text x="806" y="292" font-size="13" font-weight="700" fill="#5B21B6">WORKS KEEPS THE VERDICT</text>
  <text x="806" y="316" font-size="12" fill="#4C1D95">the patch returns to the same run</text>
  <text x="806" y="338" font-size="12" fill="#4C1D95">checks run, P0/P1 verdict is recorded</text>
  <text x="806" y="360" font-size="12" fill="#4C1D95">proof binds the diff; a person releases</text>

  <!-- bottom -->
  <rect x="40" y="440" width="1120" height="88" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#softC)"/>
  <text x="64" y="468" font-size="11" font-weight="700" fill="#9CA3AF" letter-spacing="1.4">THE BOUNDARY</text>
  <text x="64" y="496" font-size="14" fill="#334155">Orbit replaces “many harnesses in one room” inside build. It does not replace reproduction, checks, the proof or the gates.</text>
  <text x="64" y="518" font-size="13" fill="#6B7280">A patch is an input to a proof, not a proof.</text>
</svg>
