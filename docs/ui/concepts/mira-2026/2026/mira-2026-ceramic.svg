<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Mira 2026 — ceramic concept</title>
  <desc id="desc">Front-facing glazed ceramic magpie with a violet scarf, a proof card and one vermilion seal.</desc>
  <defs>
    <radialGradient id="bg" cx="42%" cy="32%" r="78%">
      <stop offset="0" stop-color="#FBFCFE"/>
      <stop offset=".62" stop-color="#F1F3F7"/>
      <stop offset="1" stop-color="#E4E8F0"/>
    </radialGradient>
    <radialGradient id="head" cx="34%" cy="24%" r="82%">
      <stop offset="0" stop-color="#565C69"/>
      <stop offset=".42" stop-color="#252A34"/>
      <stop offset=".82" stop-color="#101319"/>
      <stop offset="1" stop-color="#080A0E"/>
    </radialGradient>
    <radialGradient id="body" cx="34%" cy="22%" r="86%">
      <stop offset="0" stop-color="#4D5360"/>
      <stop offset=".45" stop-color="#242931"/>
      <stop offset=".85" stop-color="#0F1218"/>
      <stop offset="1" stop-color="#07090D"/>
    </radialGradient>
    <radialGradient id="wing" cx="28%" cy="18%" r="88%">
      <stop offset="0" stop-color="#3C424E"/>
      <stop offset=".6" stop-color="#171B22"/>
      <stop offset="1" stop-color="#080A0E"/>
    </radialGradient>
    <radialGradient id="belly" cx="38%" cy="22%" r="86%">
      <stop offset="0" stop-color="#FFFDF8"/>
      <stop offset=".55" stop-color="#F0EADD"/>
      <stop offset=".88" stop-color="#D8CEBC"/>
      <stop offset="1" stop-color="#C6BAA6"/>
    </radialGradient>
    <radialGradient id="patch" cx="38%" cy="22%" r="80%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".7" stop-color="#F4EFE4"/>
      <stop offset="1" stop-color="#D8CEBE"/>
    </radialGradient>
    <radialGradient id="beak" cx="32%" cy="22%" r="82%">
      <stop offset="0" stop-color="#4B4F58"/>
      <stop offset=".48" stop-color="#20242B"/>
      <stop offset=".86" stop-color="#0C0E12"/>
      <stop offset="1" stop-color="#050608"/>
    </radialGradient>
    <linearGradient id="scarf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B79CFF"/>
      <stop offset=".3" stop-color="#7C3AED"/>
      <stop offset=".72" stop-color="#5B21B6"/>
      <stop offset="1" stop-color="#3B0F7A"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFDF8"/>
      <stop offset=".7" stop-color="#F3ECDE"/>
      <stop offset="1" stop-color="#D7CCB8"/>
    </linearGradient>
    <radialGradient id="eye" cx="34%" cy="28%" r="76%">
      <stop offset="0" stop-color="#3A3F4A"/>
      <stop offset=".5" stop-color="#0C0E13"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".55" stop-color="#FFFFFF" stop-opacity=".18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".55"/>
    </linearGradient>
    <filter id="blur18"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="blur3"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <ellipse cx="512" cy="892" rx="250" ry="46" fill="#1A1F2B" opacity=".22" filter="url(#shadow)"/>
  <ellipse cx="512" cy="884" rx="165" ry="24" fill="#1A1F2B" opacity=".18" filter="url(#blur18)"/>

  <!-- tail, long and to the left, behind the body -->
  <path d="M 410 752 C 340 796 260 852 196 918 C 214 936 244 940 274 924 C 320 900 366 856 404 808 C 426 780 442 760 452 744 Z" fill="#0A0C10"/>
  <path d="M 422 768 C 366 812 306 862 258 912 C 280 918 306 912 332 894 C 370 866 404 828 434 792 Z" fill="#151922"/>
  <path d="M 440 782 C 398 824 354 866 316 906 C 338 908 360 900 380 884 C 410 860 434 830 454 802 Z" fill="#0F1218"/>

  <!-- body -->
  <path d="M 512 420 C 640 430 702 540 692 672 C 682 794 612 852 512 852 C 412 852 342 794 332 672 C 322 540 384 430 512 420 Z" fill="url(#body)"/>
  <!-- belly -->
  <path d="M 512 522 C 592 532 632 612 622 702 C 612 792 562 824 512 824 C 462 824 412 792 402 702 C 392 612 432 532 512 522 Z" fill="url(#belly)"/>
  <path d="M 512 522 C 592 532 632 612 622 702 C 612 792 562 824 512 824 C 462 824 412 792 402 702 C 392 612 432 532 512 522 Z" fill="none" stroke="#FFFFFF" stroke-opacity=".28" stroke-width="3"/>
  <!-- belly inner shade -->
  <path d="M 512 560 C 568 570 600 628 594 700 C 588 768 552 798 512 798 C 472 798 436 768 430 700 C 424 628 456 570 512 560 Z" fill="#FFFFFF" opacity=".16"/>

  <!-- wings -->
  <path d="M 372 478 C 330 556 330 690 378 774 C 398 806 430 796 432 764 C 436 686 412 560 400 500 Z" fill="url(#wing)"/>
  <path d="M 652 478 C 694 556 694 690 646 774 C 626 806 594 796 592 764 C 588 686 612 560 624 500 Z" fill="url(#wing)"/>
  <!-- white shoulder patches, along the wing edge -->
  <path d="M 370 520 C 392 504 414 512 424 534 C 412 570 392 596 372 606 C 360 578 358 548 370 520 Z" fill="url(#patch)"/>
  <path d="M 654 520 C 632 504 610 512 600 534 C 612 570 632 596 652 606 C 664 578 666 548 654 520 Z" fill="url(#patch)"/>
  <!-- wing rim light -->
  <path d="M 386 500 C 360 570 358 676 388 748" fill="none" stroke="#FFFFFF" stroke-opacity=".16" stroke-width="4" filter="url(#blur3)"/>
  <path d="M 638 500 C 664 570 666 676 636 748" fill="none" stroke="#FFFFFF" stroke-opacity=".22" stroke-width="4" filter="url(#blur3)"/>

  <!-- head -->
  <circle cx="512" cy="306" r="186" fill="url(#head)"/>
  <!-- crest: two small nape feathers; a magpie marker, not a penguin -->
  <path d="M 468 130 C 450 96 426 82 402 86 C 426 98 440 116 444 140 Z" fill="#0C0F14"/>
  <path d="M 500 124 C 494 92 474 74 450 72 C 470 88 480 108 482 132 Z" fill="#101319"/>
  <!-- head rim light -->
  <path d="M 348 250 A 186 186 0 0 1 512 120" fill="none" stroke="#FFFFFF" stroke-opacity=".28" stroke-width="6" filter="url(#blur3)"/>
  <path d="M 660 390 A 186 186 0 0 1 560 484" fill="none" stroke="#FFFFFF" stroke-opacity=".18" stroke-width="5" filter="url(#blur3)"/>
  <!-- head specular -->
  <ellipse cx="438" cy="220" rx="72" ry="42" fill="#FFFFFF" opacity=".12" filter="url(#blur8)" transform="rotate(-24 438 220)"/>
  <!-- neck shadow -->
  <ellipse cx="512" cy="452" rx="120" ry="34" fill="#05070A" opacity=".35" filter="url(#blur8)"/>

  <!-- eye sockets, small and inlaid -->
  <ellipse cx="454" cy="292" rx="31" ry="28" fill="#F4EFE3"/>
  <ellipse cx="570" cy="292" rx="31" ry="28" fill="#F4EFE3"/>
  <ellipse cx="454" cy="292" rx="31" ry="28" fill="none" stroke="#FFFFFF" stroke-opacity=".35" stroke-width="2"/>
  <ellipse cx="570" cy="292" rx="31" ry="28" fill="none" stroke="#FFFFFF" stroke-opacity=".35" stroke-width="2"/>
  <!-- eyes -->
  <ellipse cx="456" cy="294" rx="17" ry="19" fill="url(#eye)"/>
  <ellipse cx="568" cy="294" rx="17" ry="19" fill="url(#eye)"/>
  <circle cx="451" cy="286" r="5.5" fill="#FFFFFF" opacity=".95"/>
  <circle cx="563" cy="286" r="5.5" fill="#FFFFFF" opacity=".95"/>
  <circle cx="461" cy="300" r="2.2" fill="#FFFFFF" opacity=".55"/>
  <circle cx="573" cy="300" r="2.2" fill="#FFFFFF" opacity=".55"/>
  <!-- beak -->
  <path d="M 486 356 C 500 346 524 346 538 356 L 530 404 C 522 420 502 420 494 404 Z" fill="url(#beak)"/>
  <path d="M 498 364 C 506 360 516 360 524 364" fill="none" stroke="#FFFFFF" stroke-opacity=".22" stroke-width="3"/>
  <ellipse cx="500" cy="376" rx="10" ry="16" fill="#FFFFFF" opacity=".10" filter="url(#blur3)"/>

  <!-- scarf -->
  <path d="M 350 430 C 402 470 622 470 674 430 L 664 496 C 610 536 414 536 360 496 Z" fill="url(#scarf)"/>
  <path d="M 350 430 C 402 470 622 470 674 430" fill="none" stroke="#FFFFFF" stroke-opacity=".22" stroke-width="3"/>
  <path d="M 512 486 C 530 500 530 526 512 540 C 494 526 494 500 512 486 Z" fill="#4C1D95"/>
  <path d="M 512 538 C 540 566 548 620 530 664 L 494 664 C 476 620 484 566 512 538 Z" fill="url(#scarf)"/>
  <path d="M 512 552 C 526 580 530 622 518 650" fill="none" stroke="#FFFFFF" stroke-opacity=".18" stroke-width="3"/>
  <circle cx="512" cy="512" r="7" fill="#E2452F"/>

  <!-- proof card -->
  <g transform="translate(590 606) rotate(8)">
    <rect x="0" y="0" width="150" height="188" rx="18" fill="url(#card)"/>
    <rect x="0" y="0" width="150" height="188" rx="18" fill="none" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="3"/>
    <path d="M 24 42 H 126 M 24 72 H 104 M 24 102 H 118" stroke="#B7AD9B" stroke-width="8" stroke-linecap="round"/>
    <path d="M 54 138 L 72 156 L 108 112" stroke="#6D28D9" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="126" cy="164" r="9" fill="#E2452F"/>
  </g>
  <!-- card shadow -->
  <ellipse cx="668" cy="800" rx="70" ry="14" fill="#1A1F2B" opacity=".16" filter="url(#blur8)"/>

  <!-- feet -->
  <path d="M 470 832 C 470 858 456 878 438 892 M 438 892 L 410 902 M 438 892 L 438 918 M 438 892 L 466 904" fill="none" stroke="#0B0E13" stroke-width="14" stroke-linecap="round"/>
  <path d="M 554 832 C 554 858 568 878 586 892 M 586 892 L 614 902 M 586 892 L 586 918 M 586 892 L 558 904" fill="none" stroke="#0B0E13" stroke-width="14" stroke-linecap="round"/>

  <!-- glaze speckles -->
  <g fill="#FFFFFF" opacity=".12">
    <circle cx="392" cy="596" r="2"/><circle cx="420" cy="700" r="1.6"/><circle cx="610" cy="600" r="1.8"/>
    <circle cx="640" cy="700" r="1.4"/><circle cx="470" cy="470" r="1.5"/><circle cx="556" cy="470" r="1.3"/>
  </g>
</svg>
