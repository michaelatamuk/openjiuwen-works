    <text x="800" y="312" fill="#98A2B3" font-size="14" font-weight="700" letter-spacing="0.5" text-anchor="middle">REPORTED</text>

    <circle cx="930" cy="228" r="15" fill="#0F2A22" stroke="#34D399" stroke-width="3"/>
