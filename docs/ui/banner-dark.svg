    <text x="1060" y="312" fill="#98A2B3" font-size="14" font-weight="700" letter-spacing="0.5" text-anchor="middle">CONFIRMED</text>

    <circle cx="1190" cy="228" r="15" fill="#0F2A22" stroke="#34D399" stroke-width="3"/>
    <text x="1190" y="234" fill="#34D399" font-size="13" font-weight="800" text-anchor="middle">✓</text>
    <text x="1190" y="197" fill="#98A2B3" font-size="14" font-weight="700" letter-spacing="0.5" text-anchor="middle">FIXED</text>

    <circle cx="1320" cy="268" r="15" fill="#0F2A22" stroke="#34D399" stroke-width="3"/>
    <text x="1320" y="274" fill="#34D399" font-size="13" font-weight="800" text-anchor="middle">✓</text>
    <text x="1320" y="312" fill="#98A2B3" font-size="14" font-weight="700" letter-spacing="0.5" text-anchor="middle">CHECKED</text>

    <rect x="1447" y="214" width="26" height="26" rx="6" transform="rotate(45 1460 227)" fill="#2B2310" stroke="#FBBF24" stroke-width="3"/>
    <text x="1460" y="197" fill="#FBBF24" font-size="14" font-weight="800" letter-spacing="0.5" text-anchor="middle">READY</text>
