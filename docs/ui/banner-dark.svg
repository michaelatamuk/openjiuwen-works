  <path d="M 800 268 C 845 238 890 228 930 228 C 970 228 1010 268 1060 268 C 1108 268 1145 228 1190 228 C 1230 228 1280 268 1320 268" fill="none" stroke="#8B5CF6" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="1460" cy="228" r="30" fill="#FBBF24" opacity="0.12"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
