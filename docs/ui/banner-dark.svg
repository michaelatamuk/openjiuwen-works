  <text x="78" y="310" fill="#E8EAF0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="-2">A proven fix out.</text>
  <text x="80" y="396" fill="#98A2B3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="500">Plan gate live. Release gate next.</text>

