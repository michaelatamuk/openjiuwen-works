<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" width="1600" height="480" role="img" aria-labelledby="title desc">
  <title id="title">openJiuwen Works</title>
  <desc id="desc">A local-first software factory: one signal in, a checked and proven fix out, waiting for a person to release.</desc>
  <defs>
