    <text x="930" y="197" fill="#98A2B3" font-size="14" font-weight="700" letter-spacing="0.5" text-anchor="middle">PICKED UP</text>

    <circle cx="1060" cy="268" r="15" fill="#0F2A22" stroke="#34D399" stroke-width="3"/>
