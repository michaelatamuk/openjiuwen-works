  <text x="788" y="148" fill="#34D399" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">PASS</text>
  <text x="884" y="147" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="500">2/2 P0 · P1 100% · 1 file changed</text>
  <text x="1220" y="132" fill="#98A2B3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="0.8">NOT CHECKED</text>
  <text x="1220" y="154" fill="#E8EAF0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">No gaps recorded</text>
  <text x="788" y="174" fill="#5B6475" font-family="Cascadia Code, Consolas, monospace" font-size="13">SHA-256 4c1f…</text>

