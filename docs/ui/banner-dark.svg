      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <filter id="card" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>
  <rect width="1600" height="480" fill="#0B0D12"/>
  <rect width="1600" height="480" fill="url(#wash)"/>

  <rect x="80" y="74" width="46" height="46" rx="12" fill="#8B5CF6"/>
  <text x="103" y="105" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="800" text-anchor="middle">W</text>
  <text x="138" y="105" fill="#E8EAF0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="800" letter-spacing="-0.6"><tspan fill="#E8EAF0">openJiuwen</tspan><tspan fill="#C4B5FD" dx="7">Works</tspan></text>
  <text x="80" y="158" fill="#98A2B3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2.6">LOCAL-FIRST SOFTWARE FACTORY</text>

