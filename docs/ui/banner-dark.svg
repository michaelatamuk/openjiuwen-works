  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">
    <rect x="788" y="350" width="13" height="13" rx="3" transform="rotate(45 794 356)" fill="#0F2A22" stroke="#34D399" stroke-width="2"/>
    <text x="812" y="362" fill="#34D399">PLAN GATE · approved</text>
    <rect x="1088" y="350" width="13" height="13" rx="3" transform="rotate(45 1094 356)" fill="#2B2310" stroke="#FBBF24" stroke-width="2"/>
