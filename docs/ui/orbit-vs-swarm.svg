<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" font-family="Inter, Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <filter id="softS" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#111827" flood-opacity="0.07"/>
    </filter>
    <marker id="slateS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="690" fill="#F4F5F9"/>

  <text x="40" y="42" font-size="12" font-weight="700" fill="#6D28D9" letter-spacing="2">POSITIONING</text>
  <text x="40" y="86" font-size="32" font-weight="700" fill="#111827">A room is not a team.</text>
  <text x="40" y="114" font-size="14" fill="#6B7280">Orbit organises work across people and chats. JiuwenSwarm runs one team inside one task.</text>

  <!-- Orbit: a room -->
  <rect x="40" y="140" width="580" height="340" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#softS)"/>
  <text x="64" y="174" font-size="11" font-weight="700" fill="#0F766E" letter-spacing="1.4">ORBIT · A ROOM</text>
  <text x="64" y="204" font-size="18" font-weight="700" fill="#111827">People and their agents, in one place</text>

  <rect x="64" y="220" width="532" height="190" rx="12" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1.5"/>
  <text x="84" y="244" font-size="11" font-weight="700" fill="#0F766E" letter-spacing="1.1">ROOM · checkout service</text>

  <circle cx="92" cy="272" r="9" fill="none" stroke="#0F766E" stroke-width="1.6"/>
  <text x="108" y="276" font-size="12" font-weight="600" fill="#134E4A">you</text>
  <circle cx="160" cy="272" r="9" fill="none" stroke="#0F766E" stroke-width="1.6"/>
  <text x="176" y="276" font-size="12" font-weight="600" fill="#134E4A">Mei</text>

  <text x="84" y="302" font-size="10" font-weight="700" fill="#64748B" letter-spacing="1">AGENTS</text>
  <g font-size="11.5" font-weight="600" fill="#134E4A">
    <rect x="84" y="308" width="104" height="26" rx="13" fill="#FFFFFF" stroke="#99F6E4"/>
    <text x="136" y="325" text-anchor="middle">Claude</text>
    <rect x="198" y="308" width="104" height="26" rx="13" fill="#FFFFFF" stroke="#99F6E4"/>
    <text x="250" y="325" text-anchor="middle">Codex</text>
    <rect x="312" y="308" width="126" height="26" rx="13" fill="#FFFFFF" stroke="#99F6E4"/>
    <text x="375" y="325" text-anchor="middle">JiuwenSwarm</text>
  </g>

  <text x="84" y="352" font-size="10" font-weight="700" fill="#64748B" letter-spacing="1">CHATS &amp; MEMORY</text>
  <g font-size="11.5" font-weight="600" fill="#134E4A">
    <rect x="84" y="358" width="84" height="26" rx="13" fill="#FFFFFF" stroke="#99F6E4"/>
    <text x="126" y="375" text-anchor="middle">Slack</text>
    <rect x="178" y="358" width="92" height="26" rx="13" fill="#FFFFFF" stroke="#99F6E4"/>
    <text x="224" y="375" text-anchor="middle">Feishu</text>
    <rect x="284" y="358" width="170" height="26" rx="13" fill="#FFFFFF" stroke="#99F6E4"/>
    <text x="369" y="375" text-anchor="middle">project memory</text>
  </g>
  <text x="84" y="398" font-size="11.5" fill="#0F766E">Days and weeks of context; tasks come and go.</text>

  <text x="64" y="440" font-size="13" fill="#475569">A report from any chat lands here; the answer goes back to it.</text>
  <text x="64" y="462" font-size="13" fill="#475569">The room remembers. The task ends.</text>

  <!-- JiuwenSwarm: one team run -->
  <rect x="660" y="140" width="500" height="340" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#softS)"/>
  <text x="684" y="174" font-size="11" font-weight="700" fill="#475569" letter-spacing="1.4">JIUWENSWARM · A TEAM RUN</text>
  <text x="684" y="204" font-size="18" font-weight="700" fill="#111827">One task, split by a leader</text>

  <rect x="684" y="220" width="452" height="34" rx="9" fill="#F8FAFC" stroke="#E2E8F0"/>
  <circle cx="702" cy="237" r="6" fill="none" stroke="#475569" stroke-width="1.4"/>
  <text x="718" y="242" font-size="12" font-weight="600" fill="#334155">task: fix the parser</text>

  <line x1="910" y1="254" x2="910" y2="272" stroke="#64748B" stroke-width="2" marker-end="url(#slateS)"/>

  <rect x="820" y="272" width="180" height="32" rx="16" fill="#334155"/>
  <text x="910" y="293" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">leader</text>

  <g stroke="#64748B" stroke-width="1.8">
    <line x1="910" y1="304" x2="754" y2="322"/>
    <line x1="910" y1="304" x2="910" y2="322"/>
    <line x1="910" y1="304" x2="1064" y2="322"/>
  </g>
  <g font-size="11.5" font-weight="600" fill="#334155">
    <rect x="684" y="322" width="140" height="30" rx="15" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="754" y="341" text-anchor="middle">subagent A</text>
    <rect x="838" y="322" width="140" height="30" rx="15" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="908" y="341" text-anchor="middle">subagent B</text>
    <rect x="992" y="322" width="144" height="30" rx="15" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="1064" y="341" text-anchor="middle">subagent C</text>
  </g>

  <line x1="910" y1="352" x2="910" y2="372" stroke="#64748B" stroke-width="2" marker-end="url(#slateS)"/>
  <rect x="684" y="374" width="452" height="34" rx="9" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="700" y="396" font-size="12" font-weight="600" fill="#334155">result: patch and transcript, back to the caller</text>

  <text x="684" y="440" font-size="13" fill="#475569">Minutes, one run. No people, no chats.</text>
  <text x="684" y="462" font-size="13" fill="#475569">The team ends when the result is returned.</text>

  <!-- Layers -->
  <text x="40" y="520" font-size="11" font-weight="700" fill="#9CA3AF" letter-spacing="1.4">WHERE EACH ONE SITS</text>

  <rect x="40" y="532" width="1120" height="32" rx="10" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.2"/>
  <text x="60" y="553" font-size="11" font-weight="700" fill="#6B7280" letter-spacing="1.2">MODELS &amp; PROVIDERS</text>
  <text x="1140" y="553" font-size="11" fill="#6B7280" text-anchor="end">your choice, recorded per run</text>

  <rect x="40" y="572" width="1120" height="32" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="60" y="593" font-size="11" font-weight="700" fill="#475569" letter-spacing="1.2">HARNESS</text>
  <text x="146" y="593" font-size="12" fill="#334155">JiuwenSwarm — a leader and subagents, inside one run</text>

  <rect x="40" y="612" width="1120" height="32" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="60" y="633" font-size="11" font-weight="700" fill="#475569" letter-spacing="1.2">APPS</text>
  <text x="146" y="633" font-size="12" font-weight="700" fill="#0F766E">Orbit — rooms</text>
  <text x="272" y="633" font-size="12" fill="#64748B">·</text>
  <text x="290" y="633" font-size="12" font-weight="700" fill="#6D28D9">Works — one change</text>

  <text x="40" y="666" font-size="11.5" fill="#64748B">Orbit sits above harnesses. JiuwenSwarm is the harness. Works is one change on top of it.</text>
</svg>
