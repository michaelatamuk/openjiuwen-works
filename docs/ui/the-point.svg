<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" font-family="Inter, Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <filter id="softP" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#111827" flood-opacity="0.07"/>
    </filter>
    <marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6D28D9"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="480" fill="#F4F5F9"/>

  <text x="40" y="44" font-size="12" font-weight="700" fill="#6D28D9" letter-spacing="2">THE POINT</text>
  <text x="40" y="88" font-size="34" font-weight="700" fill="#111827">Same people. Different hours.</text>
  <text x="40" y="116" font-size="14" fill="#6B7280">Who does each stage.</text>

  <!-- Today -->
  <rect x="40" y="136" width="520" height="310" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#softP)"/>
  <text x="64" y="168" font-size="11" font-weight="700" fill="#9CA3AF" letter-spacing="1.2">THE OLD WAY</text>

  <circle cx="96" cy="280" r="15" fill="none" stroke="#6B7280" stroke-width="2"/>
  <circle cx="91" cy="276" r="1.5" fill="#6B7280"/>
  <circle cx="101" cy="276" r="1.5" fill="#6B7280"/>
  <path d="M 90 288 Q 96 281 102 288" fill="none" stroke="#6B7280" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 96 296 L 96 334" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round"/>
  <path d="M 96 308 L 78 326" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round"/>
  <path d="M 96 308 L 114 326" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round"/>
  <path d="M 104 285 Q 107 289 104 292 Q 101 289 104 285 Z" fill="#93C5FD"/>
  <text x="96" y="358" font-size="13" fill="#6B7280" text-anchor="middle">you</text>

  <rect x="150" y="175" width="360" height="30" rx="8" fill="#F3F4F6" stroke="#E5E7EB"/>
  <text x="168" y="195" font-size="14" fill="#374151">reproduce</text>
  <rect x="150" y="215" width="360" height="30" rx="8" fill="#F3F4F6" stroke="#E5E7EB"/>
  <text x="168" y="235" font-size="14" fill="#374151">plan</text>
  <rect x="150" y="255" width="360" height="30" rx="8" fill="#F3F4F6" stroke="#E5E7EB"/>
  <text x="168" y="275" font-size="14" fill="#374151">build</text>
  <rect x="150" y="295" width="360" height="30" rx="8" fill="#F3F4F6" stroke="#E5E7EB"/>
  <text x="168" y="315" font-size="14" fill="#374151">check</text>
  <rect x="150" y="335" width="360" height="30" rx="8" fill="#F3F4F6" stroke="#E5E7EB"/>
  <text x="168" y="355" font-size="14" fill="#374151">prove</text>
  <rect x="150" y="375" width="360" height="30" rx="8" fill="#F3F4F6" stroke="#E5E7EB"/>
  <text x="168" y="395" font-size="14" fill="#374151">release</text>

  <line x1="128" y1="300" x2="146" y2="300" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrowP)"/>

  <text x="64" y="426" font-size="14" fill="#6B7280">Technical work fills the day.</text>

  <!-- With Works -->
  <rect x="580" y="136" width="580" height="310" rx="16" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5" filter="url(#softP)"/>
  <text x="604" y="168" font-size="11" font-weight="700" fill="#6D28D9" letter-spacing="1.2">WITH OPENJIUWEN</text>

  <rect x="610" y="245" width="46" height="46" rx="13" fill="#EDE9FE" stroke="#C4B5FD"/>
  <circle cx="625" cy="264" r="3.2" fill="#6D28D9"/>
  <circle cx="641" cy="264" r="3.2" fill="#6D28D9"/>
  <path d="M 623 277 Q 633 284 643 277" fill="none" stroke="#6D28D9" stroke-width="2" stroke-linecap="round"/>
  <text x="633" y="310" font-size="13" fill="#6D28D9" text-anchor="middle">agent</text>

  <rect x="680" y="175" width="230" height="30" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="698" y="195" font-size="14" fill="#6B7280">reproduce</text>
  <rect x="680" y="215" width="230" height="30" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="698" y="235" font-size="14" fill="#6B7280">plan</text>
  <rect x="680" y="255" width="230" height="30" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="698" y="275" font-size="14" fill="#6B7280">build</text>
  <rect x="680" y="295" width="230" height="30" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="698" y="315" font-size="14" fill="#6B7280">check</text>
  <rect x="680" y="335" width="230" height="30" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="698" y="355" font-size="14" fill="#6B7280">prove</text>
  <rect x="680" y="375" width="230" height="30" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="698" y="395" font-size="14" fill="#6B7280">release</text>

  <line x1="914" y1="230" x2="952" y2="230" stroke="#6D28D9" stroke-width="2" marker-end="url(#arrowP)"/>
  <line x1="914" y1="390" x2="952" y2="390" stroke="#6D28D9" stroke-width="2" marker-end="url(#arrowP)"/>

  <rect x="960" y="215" width="150" height="30" rx="15" fill="#EDE9FE" stroke="#C4B5FD"/>
  <circle cx="978" cy="230" r="4" fill="none" stroke="#6D28D9" stroke-width="1.4"/>
  <path d="M 971 241 Q 978 234 985 241" fill="none" stroke="#6D28D9" stroke-width="1.4"/>
  <text x="994" y="235" font-size="12" font-weight="700" fill="#6D28D9">you approve</text>

  <rect x="960" y="375" width="150" height="30" rx="15" fill="#EDE9FE" stroke="#C4B5FD"/>
  <circle cx="978" cy="390" r="4" fill="none" stroke="#6D28D9" stroke-width="1.4"/>
  <path d="M 971 401 Q 978 394 985 401" fill="none" stroke="#6D28D9" stroke-width="1.4"/>
  <text x="994" y="395" font-size="12" font-weight="700" fill="#6D28D9">you approve</text>

  <text x="604" y="426" font-size="14" fill="#6B7280">The agent runs all six; you approve the plan and the release.</text>
