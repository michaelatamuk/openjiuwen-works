<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="Inter, Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <filter id="softP" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#111827" flood-opacity="0.07"/>
    </filter>
    <marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6D28D9"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="420" fill="#F4F5F9"/>

  <text x="40" y="46" font-size="11" font-weight="700" fill="#6D28D9" letter-spacing="2">THE POINT</text>
  <text x="40" y="86" font-size="30" font-weight="700" fill="#111827">Same people. Different hours.</text>

  <!-- Today -->
  <rect x="40" y="112" width="540" height="268" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#softP)"/>
  <text x="64" y="144" font-size="10" font-weight="700" fill="#9CA3AF" letter-spacing="1.4">TODAY</text>

  <circle cx="96" cy="192" r="14" fill="none" stroke="#6B7280" stroke-width="2"/>
  <path d="M 72 238 Q 96 206 120 238" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round"/>
  <text x="96" y="262" font-size="11" fill="#6B7280" text-anchor="middle">you</text>

  <rect x="150" y="160" width="220" height="30" rx="8" fill="#F3F4F6" stroke="#E5E7EB"/>
  <text x="166" y="180" font-size="11.5" fill="#4B5563">reproduce</text>
  <rect x="150" y="198" width="220" height="30" rx="8" fill="#F3F4F6" stroke="#E5E7EB"/>
  <text x="166" y="218" font-size="11.5" fill="#4B5563">build</text>
  <rect x="150" y="236" width="220" height="30" rx="8" fill="#F3F4F6" stroke="#E5E7EB"/>
  <text x="166" y="256" font-size="11.5" fill="#4B5563">check</text>
  <rect x="150" y="274" width="220" height="30" rx="8" fill="#F3F4F6" stroke="#E5E7EB"/>
  <text x="166" y="294" font-size="11.5" fill="#4B5563">prove</text>

  <line x1="128" y1="230" x2="146" y2="230" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrowP)"/>

  <text x="64" y="348" font-size="12" fill="#6B7280">Technical work fills the day.</text>

  <!-- With Works -->
  <rect x="620" y="112" width="540" height="268" rx="16" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5" filter="url(#softP)"/>
  <text x="644" y="144" font-size="10" font-weight="700" fill="#6D28D9" letter-spacing="1.4">WITH WORKS</text>

  <rect x="660" y="170" width="42" height="42" rx="12" fill="#EDE9FE" stroke="#C4B5FD"/>
  <circle cx="674" cy="188" r="3" fill="#6D28D9"/>
  <circle cx="688" cy="188" r="3" fill="#6D28D9"/>
  <path d="M 672 200 Q 681 206 690 200" fill="none" stroke="#6D28D9" stroke-width="2" stroke-linecap="round"/>
  <text x="681" y="230" font-size="11" fill="#6D28D9" text-anchor="middle">agent</text>

  <rect x="730" y="160" width="210" height="30" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="746" y="180" font-size="11.5" fill="#6B7280">reproduce</text>
  <rect x="730" y="198" width="210" height="30" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="746" y="218" font-size="11.5" fill="#6B7280">build</text>
  <rect x="730" y="236" width="210" height="30" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="746" y="256" font-size="11.5" fill="#6B7280">check</text>
  <rect x="730" y="274" width="210" height="30" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="746" y="294" font-size="11.5" fill="#6B7280">prove</text>

  <text x="835" y="326" font-size="10.5" font-weight="700" fill="#6D28D9" text-anchor="middle" letter-spacing="0.8">RUNS ITSELF</text>
  <line x1="960" y1="255" x2="1000" y2="255" stroke="#6D28D9" stroke-width="2" marker-end="url(#arrowP)"/>

  <circle cx="1030" cy="192" r="14" fill="none" stroke="#6B7280" stroke-width="2"/>
  <path d="M 1006 238 Q 1030 206 1054 238" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round"/>
  <text x="1030" y="262" font-size="11" fill="#6B7280" text-anchor="middle">you</text>

  <rect x="1080" y="180" width="60" height="26" rx="13" fill="#EDE9FE" stroke="#C4B5FD"/>
  <text x="1110" y="197" font-size="10" font-weight="700" fill="#6D28D9" text-anchor="middle">plan</text>
  <rect x="1080" y="214" width="60" height="26" rx="13" fill="#EDE9FE" stroke="#C4B5FD"/>
  <text x="1110" y="231" font-size="10" font-weight="700" fill="#6D28D9" text-anchor="middle">release</text>

  <text x="644" y="348" font-size="12" fill="#6B7280">Your hours go to judgement and design.</text>
</svg>
