<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" width="1600" height="480" role="img" aria-labelledby="title desc">
  <title id="title">openJiuwen Works</title>
  <desc id="desc">A local-first software factory: one signal in, a released fix out, back to the source.</desc>
  <defs>
    <radialGradient id="wash" cx="84%" cy="14%" r="60%">
      <stop offset="0" stop-color="#6D28D9" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#6D28D9" stop-opacity="0"/>
    </radialGradient>
    <filter id="card" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#111827" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1600" height="480" fill="#F4F5F9"/>
  <rect width="1600" height="480" fill="url(#wash)"/>

  <rect x="80" y="74" width="46" height="46" rx="12" fill="#6D28D9"/>
  <text x="103" y="105" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="800" text-anchor="middle">W</text>
  <text x="138" y="105" fill="#111827" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="800" letter-spacing="-0.6"><tspan fill="#111827">openJiuwen</tspan><tspan fill="#6D28D9" dx="7">Works</tspan></text>
  <text x="80" y="158" fill="#6B7280" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2.6">LOCAL-FIRST SOFTWARE FACTORY</text>

  <text x="78" y="250" fill="#111827" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="-2">One signal in.</text>
  <text x="78" y="310" fill="#111827" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="-2">A released fix out.</text>
  <text x="80" y="396" fill="#6B7280" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="500">Every fix shows its work.</text>

  <g filter="url(#card)">
    <rect x="748" y="56" width="772" height="368" rx="24" fill="#FFFFFF" stroke="#E3E7EF"/>
  </g>
  <text x="788" y="104" fill="#6D28D9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="2">PROOF</text>
  <text x="788" y="148" fill="#047857" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">PASS</text>
  <text x="884" y="147" fill="#4B5563" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="500">2/2 P0 · P1 100% · 1 file changed</text>
  <text x="788" y="174" fill="#9CA3AF" font-family="Cascadia Code, Consolas, monospace" font-size="13">SHA-256 4c1f…</text>

  <path d="M 800 268 C 845 238 890 228 930 228 C 970 228 1010 268 1060 268 C 1108 268 1145 228 1190 228 C 1230 228 1280 268 1320 268 C 1360 268 1410 238 1460 228" fill="none" stroke="#6D28D9" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="1460" cy="228" r="30" fill="#047857" opacity="0.10"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <circle cx="800" cy="268" r="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2.5"/>
    <text x="800" y="312" fill="#6B7280" font-size="14" font-weight="700" letter-spacing="0.5" text-anchor="middle">REPORTED</text>

    <circle cx="930" cy="228" r="15" fill="#E8F8F1" stroke="#047857" stroke-width="3"/>
    <text x="930" y="234" fill="#047857" font-size="13" font-weight="800" text-anchor="middle">✓</text>
    <text x="930" y="197" fill="#6B7280" font-size="14" font-weight="700" letter-spacing="0.5" text-anchor="middle">PICKED UP</text>

    <circle cx="1060" cy="268" r="15" fill="#E8F8F1" stroke="#047857" stroke-width="3"/>
    <text x="1060" y="274" fill="#047857" font-size="13" font-weight="800" text-anchor="middle">✓</text>
    <text x="1060" y="312" fill="#6B7280" font-size="14" font-weight="700" letter-spacing="0.5" text-anchor="middle">CONFIRMED</text>

    <rect x="1117" y="240" width="16" height="16" rx="4" transform="rotate(45 1125 248)" fill="#E8F8F1" stroke="#047857" stroke-width="2.5"/>
    <text x="1125" y="252" fill="#047857" font-size="9" font-weight="800" text-anchor="middle">✓</text>
    <text x="1125" y="342" fill="#047857" font-size="11" font-weight="800" letter-spacing="0.5" text-anchor="middle">PLAN GATE · approved</text>

    <circle cx="1190" cy="228" r="15" fill="#E8F8F1" stroke="#047857" stroke-width="3"/>
    <text x="1190" y="234" fill="#047857" font-size="13" font-weight="800" text-anchor="middle">✓</text>
    <text x="1190" y="197" fill="#6B7280" font-size="14" font-weight="700" letter-spacing="0.5" text-anchor="middle">FIXED</text>

    <circle cx="1320" cy="268" r="15" fill="#E8F8F1" stroke="#047857" stroke-width="3"/>
    <text x="1320" y="274" fill="#047857" font-size="13" font-weight="800" text-anchor="middle">✓</text>
    <text x="1320" y="312" fill="#6B7280" font-size="14" font-weight="700" letter-spacing="0.5" text-anchor="middle">CHECKED</text>

    <rect x="1382" y="240" width="16" height="16" rx="4" transform="rotate(45 1390 248)" fill="#E8F8F1" stroke="#047857" stroke-width="2.5"/>
    <text x="1390" y="252" fill="#047857" font-size="9" font-weight="800" text-anchor="middle">✓</text>
    <text x="1390" y="342" fill="#047857" font-size="11" font-weight="800" letter-spacing="0.5" text-anchor="middle">RELEASE GATE · approved</text>

    <circle cx="1460" cy="228" r="20" fill="#E8F8F1" stroke="#047857" stroke-width="4"/>
    <text x="1460" y="235" fill="#047857" font-size="15" font-weight="800" text-anchor="middle">✓</text>
    <text x="1460" y="197" fill="#047857" font-size="14" font-weight="800" letter-spacing="0.5" text-anchor="middle">RELEASED</text>
  </g>
</svg>
