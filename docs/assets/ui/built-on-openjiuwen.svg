<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" font-family="Inter, Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <filter id="softL" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#111827" flood-opacity="0.07"/>
    </filter>
    <marker id="arrowL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6D28D9"/>
    </marker>
    <marker id="arrowLG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="400" fill="#F4F5F9"/>

  <!-- Works layer: the Works accent -->
  <rect x="40" y="30" width="920" height="90" rx="14" fill="#FFFFFF" stroke="#6D28D9" stroke-width="1.5" filter="url(#softL)"/>
  <text x="64" y="58" font-size="12" font-weight="700" fill="#6D28D9" letter-spacing="1.4">WORKS · THE FACTORY</text>
  <rect x="64" y="72" width="120" height="28" rx="14" fill="#F5F3FF" stroke="#DDD6FE"/>
  <text x="124" y="90" font-size="13" font-weight="700" fill="#5B21B6" text-anchor="middle">queue</text>
  <rect x="194" y="72" width="130" height="28" rx="14" fill="#F5F3FF" stroke="#DDD6FE"/>
  <text x="259" y="90" font-size="13" font-weight="700" fill="#5B21B6" text-anchor="middle">plan gate</text>
  <rect x="334" y="72" width="140" height="28" rx="14" fill="#F5F3FF" stroke="#DDD6FE"/>
  <text x="404" y="90" font-size="13" font-weight="700" fill="#5B21B6" text-anchor="middle">release gate</text>
  <rect x="484" y="72" width="110" height="28" rx="14" fill="#F5F3FF" stroke="#DDD6FE"/>
  <text x="539" y="90" font-size="13" font-weight="700" fill="#5B21B6" text-anchor="middle">proof</text>
  <rect x="604" y="72" width="120" height="28" rx="14" fill="#F5F3FF" stroke="#DDD6FE"/>
  <text x="664" y="90" font-size="13" font-weight="700" fill="#5B21B6" text-anchor="middle">delivery</text>
  <rect x="734" y="72" width="140" height="28" rx="14" fill="#F5F3FF" stroke="#DDD6FE"/>
  <text x="804" y="90" font-size="13" font-weight="700" fill="#5B21B6" text-anchor="middle">confirmation</text>

  <line x1="500" y1="166" x2="500" y2="124" stroke="#6D28D9" stroke-width="2" marker-end="url(#arrowL)"/>
  <text x="512" y="150" font-size="12" fill="#6D28D9">adds the gates, the proof and delivery</text>

  <!-- openJiuwen layer: neutral, its own identity -->
  <rect x="80" y="170" width="840" height="90" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#softL)"/>
  <text x="104" y="198" font-size="12" font-weight="700" fill="#475569" letter-spacing="1.4">openJiuwen · THE AGENT LAYER</text>
  <rect x="104" y="212" width="140" height="28" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="174" y="230" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">planner</text>
  <rect x="254" y="212" width="140" height="28" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="324" y="230" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">builder</text>
  <rect x="404" y="212" width="160" height="28" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="484" y="230" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">challenger</text>
  <rect x="574" y="212" width="190" height="28" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="669" y="230" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">JiuwenSwarm</text>

  <line x1="500" y1="306" x2="500" y2="264" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowLG)"/>
  <text x="512" y="290" font-size="12" fill="#64748B">runs on</text>

  <!-- models layer -->
  <rect x="120" y="310" width="760" height="60" rx="14" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5" filter="url(#softL)"/>
  <text x="144" y="336" font-size="12" font-weight="700" fill="#6B7280" letter-spacing="1.4">MODELS &amp; PROVIDERS</text>
  <text x="856" y="336" font-size="12" fill="#6B7280" text-anchor="end">your choice, recorded per run</text>
</svg>
