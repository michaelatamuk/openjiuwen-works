name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Sync
        run: uv sync --frozen --extra dev --extra server
      - name: Console smoke
        run: |
          uv run works --help > /dev/null
          uv run works version > /dev/null
      - name: OpenAPI schema
        run: uv run python scripts/dump_openapi.py --check
      - name: Lint
        run: uv run ruff check src tests
      - name: Format
        run: uv run ruff format --check src tests
      - name: Docs links
        run: uv run python scripts/check_docs_links.py
      - name: Types
        run: uv run mypy
      - name: Tests with coverage
        run: >
          uv run pytest tests -q -m "not slow"
          --cov=src/works --cov-report=term-missing --cov-report=xml
          --cov-fail-under=80
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore
      - name: Integration evidence on failure
        if: failure()
        run: |
          find /tmp/pytest-of-runner -name commands.jsonl -print -exec cat {} \; || true
          find /tmp/pytest-of-runner -name evidence.md -print -exec sed -n '1,100p' {} \; || true

  py313:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen --extra dev --extra server
      - name: Contract and API tests
        run: uv run pytest tests/unit/interfaces/api tests/contract -q

  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --extra dev --extra server
      - name: Daemon lifecycle and restart reconciliation
        run: uv run python scripts/smoke_daemon.py

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
        working-directory: web
      - name: Generate API types
        run: npm run generate:api
        working-directory: web
      - name: Generated client is current
        run: git diff --ignore-cr-at-eol --exit-code -- web/src/api/generated
      - name: Typecheck
        run: npm run typecheck
        working-directory: web
      - name: Lint
        run: npm run lint
        working-directory: web
      - name: Unit tests
        run: npm test
        working-directory: web
      - name: Runtime dependency audit
        run: npm audit --omit=dev
        working-directory: web
      - name: Build
        run: npm run build
        working-directory: web
      - name: Built bundle is committed
        run: git diff --ignore-cr-at-eol --exit-code -- src/works/interfaces/ui/static/dist
      - name: No type escapes in production code
        working-directory: web
        run: |
          matches=$(grep -RnE '(:[[:space:]]*any\b|as any\b|@ts-ignore|@ts-expect-error)' src \
            --include='*.ts' --include='*.tsx' | grep -v '^src/test/' || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "Remove any/@ts-ignore from web/src (only src/test fixtures may cast raw JSON)."
            exit 1
          fi

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv python install 3.12
      - run: uv sync --frozen --extra dev --extra server
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Browser journeys against a real daemon
        run: npm run e2e
        working-directory: web

  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - name: Build wheel
        run: uv build --wheel
      - name: Wheel contains the runtime bundle
        run: python3 scripts/check_wheel.py dist/*.whl
      - name: Installed wheel smoke
        run: |
          uv sync --frozen --extra server
          uv run python scripts/smoke_wheel.py --wheel dist/*.whl

  docker-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --extra dev
      - name: Live Docker verifier
        env:
          WORKS_TEST_DOCKER: "1"
        run: uv run pytest tests/integration/test_docker_live.py -q

  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --extra dev --extra server
      - name: Budgets
        run: uv run pytest tests/integration/test_performance.py -q -m slow
      - name: Read API p95 with 20 SSE streams
        run: uv run python scripts/bench_api.py

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --extra dev
      - name: Bandit
        run: uv run bandit -q -r src -c pyproject.toml
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
