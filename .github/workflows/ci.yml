name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Sync
        run: uv sync --frozen --extra dev
      - name: Console smoke
        run: |
          uv run works --help > /dev/null
          uv run works version > /dev/null
      - name: OpenAPI schema
        run: uv run python scripts/dump_openapi.py --check
      - name: Lint
        run: uv run ruff check src tests
      - name: Format
        run: uv run ruff format --check src tests
      - name: Types
        run: uv run mypy
      - name: Tests with coverage
        run: >
          uv run pytest tests -q -m "not slow"
          --cov=src/works --cov-report=term-missing --cov-report=xml
          --cov-fail-under=80
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore
      - name: Integration evidence on failure
        if: failure()
        run: |
          find /tmp/pytest-of-runner -name commands.jsonl -print -exec cat {} \; || true
          find /tmp/pytest-of-runner -name evidence.md -print -exec sed -n '1,100p' {} \; || true

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
        working-directory: web
      - name: Typecheck
        run: npm run typecheck
        working-directory: web
      - name: Unit tests
        run: npm test
        working-directory: web
      - name: Build
        run: npm run build
        working-directory: web
      - name: Built bundle is committed
        run: git diff --ignore-cr-at-eol --exit-code -- src/works/interfaces/ui/static/dist

  docker-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --extra dev
      - name: Live Docker verifier
        env:
          WORKS_TEST_DOCKER: "1"
        run: uv run pytest tests/integration/test_docker_live.py -q

  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --extra dev
      - name: Budgets
        run: uv run pytest tests/integration/test_performance.py -q -m slow

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --extra dev
      - name: Bandit
        run: uv run bandit -q -r src -c pyproject.toml
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
