name: osv

# Full OSV.dev scan: covers transitive dependencies in uv.lock and web/package-lock.json,
# which pip-audit and npm audit do not aggregate. Results also land in Security > Code scanning.
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 12 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  security-events: write
  contents: read

jobs:
  scan:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.1
