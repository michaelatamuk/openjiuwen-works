name: mutation

# Mutmut does not run natively on Windows, so this gate lives on Linux and is not part of every PR.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --extra dev
      - name: Mutation gate at 70% killed
        run: uv run python scripts/mutation_gate.py
