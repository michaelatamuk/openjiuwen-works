<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Inter, Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <filter id="softT" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#111827" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="#F4F5F9"/>

  <!-- Header -->
  <text x="80" y="66" font-size="12" font-weight="700" fill="#6D28D9" letter-spacing="2.2">OPENJIUWEN WORKS · TECHNICAL APPENDIX</text>
  <text x="80" y="112" font-size="38" font-weight="700" fill="#111827">How the loop is wired</text>
  <text x="80" y="146" font-size="16.5" fill="#4B5563">The same ten steps, with the mechanism behind each one.</text>

  <!-- Steps -->
  <rect x="80" y="185" width="820" height="560" rx="18" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#softT)"/>
  <text x="104" y="214" font-size="11" font-weight="700" fill="#6D28D9" letter-spacing="1.6">THE LOOP</text>

  <text x="104" y="258" font-size="14.5"><tspan font-weight="700" fill="#6D28D9">1</tspan><tspan font-weight="700" fill="#111827">  Reads the signal</tspan><tspan fill="#4B5563"> — three intakes; a work item gets scope, repo, budget.</tspan></text>
  <text x="104" y="308" font-size="14.5"><tspan font-weight="700" fill="#6D28D9">2</tspan><tspan font-weight="700" fill="#111827">  Finds the code</tspan><tspan fill="#4B5563"> — product-to-repository binding; search and LSP.</tspan></text>
  <text x="104" y="358" font-size="14.5"><tspan font-weight="700" fill="#6D28D9">3</tspan><tspan font-weight="700" fill="#111827">  Plans the fix</tspan><tspan fill="#4B5563"> — a spec draft; gate 1: a person agrees.</tspan></text>
  <text x="104" y="408" font-size="14.5"><tspan font-weight="700" fill="#6D28D9">4</tspan><tspan font-weight="700" fill="#111827">  Builds it</tspan><tspan fill="#4B5563"> — one git worktree per task; nothing shared.</tspan></text>
  <text x="104" y="458" font-size="14.5"><tspan font-weight="700" fill="#6D28D9">5</tspan><tspan font-weight="700" fill="#111827">  Checks it</tspan><tspan fill="#4B5563"> — hidden scenarios outside the repo; a fresh agent.</tspan></text>
  <text x="104" y="508" font-size="14.5"><tspan font-weight="700" fill="#6D28D9">6</tspan><tspan font-weight="700" fill="#111827">  Writes the proof</tspan><tspan fill="#4B5563"> — diff, gate output, verdict, cost: one page.</tspan></text>
  <text x="104" y="558" font-size="14.5"><tspan font-weight="700" fill="#6D28D9">7</tspan><tspan font-weight="700" fill="#111827">  Hands it over</tspan><tspan fill="#4B5563"> — gate 2: a person approves; the decision is hash-bound.</tspan></text>
  <text x="104" y="608" font-size="14.5"><tspan font-weight="700" fill="#6D28D9">8</tspan><tspan font-weight="700" fill="#111827">  Ships the fix</tspan><tspan fill="#4B5563"> — merge or PR; deploy where the bug was seen.</tspan></text>
  <text x="104" y="658" font-size="14.5"><tspan font-weight="700" fill="#6D28D9">9</tspan><tspan font-weight="700" fill="#111827">  Confirms it</tspan><tspan fill="#4B5563"> — re-run the original scenario; close the report.</tspan></text>
  <text x="104" y="708" font-size="14.5"><tspan font-weight="700" fill="#6D28D9">10</tspan><tspan font-weight="700" fill="#111827">  Records it</tspan><tspan fill="#4B5563"> — one ledger row: cost, duration, escapes, rework.</tspan></text>

  <!-- Isolation -->
  <rect x="940" y="185" width="580" height="270" rx="18" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#softT)"/>
  <text x="964" y="214" font-size="11" font-weight="700" fill="#6D28D9" letter-spacing="1.6">ISOLATION AND PROOF</text>

  <circle cx="970" cy="252" r="4" fill="#6D28D9"/>
  <text x="988" y="257" font-size="14" fill="#374151">A worktree per task; a sandbox per run.</text>
  <circle cx="970" cy="288" r="4" fill="#6D28D9"/>
  <text x="988" y="293" font-size="14" fill="#374151">Scenarios live where the builder cannot write.</text>
  <circle cx="970" cy="324" r="4" fill="#6D28D9"/>
  <text x="988" y="329" font-size="14" fill="#374151">The checker starts clean — no builder context.</text>
  <circle cx="970" cy="360" r="4" fill="#6D28D9"/>
  <text x="988" y="365" font-size="14" fill="#374151">Approval binds to a prepared action hash.</text>
  <circle cx="970" cy="396" r="4" fill="#6D28D9"/>
  <text x="988" y="401" font-size="14" fill="#374151">Every action is recorded with its reason.</text>

  <!-- Integration -->
  <rect x="940" y="475" width="580" height="270" rx="18" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#softT)"/>
  <text x="964" y="504" font-size="11" font-weight="700" fill="#6D28D9" letter-spacing="1.6">INTEGRATION POINTS</text>

  <text x="964" y="546" font-size="14" fill="#374151"><tspan font-weight="700" fill="#111827">agent-core</tspan> — HarnessProtocol: start, send, events, checkpoint.</text>
  <text x="964" y="582" font-size="14" fill="#374151"><tspan font-weight="700" fill="#111827">jiuwenswarm</tspan> — build loop: worktree, CI, auto-fix, PR.</text>
  <text x="964" y="618" font-size="14" fill="#374151"><tspan font-weight="700" fill="#111827">PPMA</tspan> — project state in a published contract shape.</text>
  <text x="964" y="654" font-size="14" fill="#374151"><tspan font-weight="700" fill="#111827">Orbit</tspan> — optional: publish the proof to a team room.</text>
  <text x="964" y="690" font-size="14" fill="#6B7280">No forks. No patches.</text>

  <!-- Footer -->
  <line x1="80" y1="790" x2="1520" y2="790" stroke="#DDE2E8" stroke-width="1.5"/>
  <text x="80" y="822" font-size="14" fill="#374151">Every reused link is consumed through a published contract — nothing is forked, nothing is patched.</text>
</svg>
